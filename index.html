<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Head & Neck Anatomy</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --border: #e2e8f0; --accent: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        /* --- LAYOUT --- */
        .app-container { display: grid; grid-template-columns: 80px 260px 1fr 340px; height: 100vh; }

        /* Phase Rail */
        .phase-rail { background: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .phase-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; font-size: 1.2rem; position: relative; }
        .phase-icon:hover { background: var(--brand); }
        .phase-icon.active { background: var(--brand); box-shadow: 0 0 15px var(--brand); }

        /* Subject Sidebar */
        .subject-sidebar { background: white; border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
        .sidebar-title { font-size: 0.65rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .sub-link { padding: 12px 15px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 5px; display: block; transition: 0.2s; }
        .sub-link:hover, .sub-link.active { background: var(--brand-light); color: var(--brand); }

        /* Main Content */
        main.content-view { padding: 40px; overflow-y: auto; }
        .content-card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); max-width: 1000px; margin: 0 auto; border: 1px solid var(--border); }
        
        /* Typography & Components */
        h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; }
        .overview-text { color: var(--text-light); line-height: 1.6; margin-bottom: 30px; font-size: 1.05rem; }
        h2 { font-size: 1.4rem; color: var(--brand); margin: 40px 0 20px; display: flex; align-items: center; gap: 10px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .clinical-box { background: #f8fafc; padding: 20px; border-radius: 15px; border-left: 4px solid var(--brand); }
        .relevance-tag { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 0.85rem; }
        .relevance-tag b { color: var(--accent); text-transform: uppercase; font-size: 0.7rem; display: block; margin-bottom: 5px; }

        /* High Yield Table */
        .table-container { margin-top: 40px; border-radius: 15px; overflow: hidden; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: var(--brand); color: white; padding: 15px; text-align: left; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }

        /* Utility Panel */
        .utility-panel { background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .ai-header { padding: 20px; background: var(--brand); color: white; font-weight: 800; font-size: 0.9rem; }
        textarea#notes { flex: 1; border: none; padding: 20px; font-size: 0.9rem; background: #fffdf5; outline: none; resize: none; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- PHASE RAIL -->
    <nav class="phase-rail">
        <div class="phase-icon active" onclick="loadPhase(1)"><i class="fa-solid fa-brain"></i></div>
        <div class="phase-icon" onclick="loadPhase(2)"><i class="fa-solid fa-tooth"></i></div>
        <div class="phase-icon" onclick="loadPhase(3)"><i class="fa-solid fa-toolbox"></i></div>
        <div class="phase-icon" onclick="loadPhase(4)"><i class="fa-solid fa-rotate"></i></div>
    </nav>

    <!-- SUBJECT SIDEBAR -->
    <aside class="subject-sidebar">
        <div class="sidebar-title" id="phase-name">Foundations</div>
        <div id="subject-list"></div>
    </aside>

    <!-- CONTENT VIEWER -->
    <main class="content-view">
        <div id="content-render" class="content-card">
            <!-- Anatomy content will be injected here -->
        </div>
    </main>

    <!-- UTILITY PANEL -->
    <aside class="utility-panel">
        <div class="ai-header"><i class="fa-solid fa-robot"></i> DentoAI Assistant</div>
        <div style="flex:1; background: #eee;">
             <iframe src="https://www.chatbase.co/chatbot-iframe/v_your_id" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <div style="padding:10px; font-size:0.65rem; font-weight:800; color:var(--text-light);">MY STUDY NOTES</div>
        <textarea id="notes" placeholder="Notes auto-save for this module..."></textarea>
    </aside>
</div>

<script>
    const curriculum = {
        phase1: {
            name: "Core Foundations",
            subjects: {
                "Anatomy": {
                    title: "Head & Neck Anatomy Mastery",
                    overview: "Essential for diagnosis, anesthesia, surgery, and dental procedures.",
                    sections: [
                        {
                            type: "grid",
                            title: "1. Skull & Bony Landmarks",
                            items: [
                                { h: "Key Bones", p: "Maxilla (Upper Jaw), Mandible (Movable Lower Jaw), Zygomatic (Cheek), Temporal (Ear housing)." },
                                { h: " Landmarks", p: "Mental Foramen (Mental Nerve), Infraorbital Foramen, Mandibular Foramen (IAN)." }
                            ],
                            relevance: "Local anesthesia injections, surgical access, fracture ID."
                        },
                        {
                            type: "grid",
                            title: "2. Muscles of Mastication",
                            items: [
                                { h: "Main Muscles", p: "Masseter (Elevates), Temporalis (Elevates/Retracts), Medial Pterygoid, Lateral Pterygoid (Opening/Protrusion)." },
                                { h: "Innervation", p: "Mandibular division of Trigeminal Nerve (V3)." }
                            ],
                            relevance: "TMJ disorders, Bruxism, Trismus (lockjaw)."
                        }
                    ],
                    nerves: `
                        <h2>⚡ 3. Cranial Nerves (High-Yield)</h2>
                        <div class="grid-2">
                            <div class="clinical-box"><b>Trigeminal (CN V)</b><br>V1: Sensory, V2: Maxillary, V3: Mandibular (Sensory + Motor).</div>
                            <div class="clinical-box"><b>Facial (CN VII)</b><br>Expression + Taste (Ant 2/3 Tongue).</div>
                            <div class="clinical-box"><b>Glossopharyngeal (IX)</b><br>Taste (Post 1/3).</div>
                            <div class="clinical-box"><b>Hypoglossal (XII)</b><br>Tongue movement.</div>
                        </div>
                    `,
                    blood: `
                        <h2>🩸 4. Blood Supply</h2>
                        <p><b>Major Artery:</b> External Carotid Artery</p>
                        <ul><li>Facial Artery</li><li>Maxillary Artery</li><li>Lingual Artery</li></ul>
                        <div class="relevance-tag"><b>Clinical Relevance</b>Bleeding control, spread of infection.</div>
                    `,
                    table: `
                        <h2>📚 High-Yield Summary Table</h2>
                        <div class="table-container">
                            <table>
                                <thead><tr><th>Structure</th><th>Function</th><th>Clinical Importance</th></tr></thead>
                                <tbody>
                                    <tr><td>Mandible</td><td>Jaw Movement</td><td>Fractures, Anesthesia</td></tr>
                                    <tr><td>Trigeminal Nerve</td><td>Sensation + Mastication</td><td>Nerve Block</td></tr>
                                    <tr><td>Facial Nerve</td><td>Expression</td><td>Bell's Palsy</td></tr>
                                    <tr><td>Maxillary Artery</td><td>Blood Supply</td><td>Surgical Bleeding</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `
                },
                "Physiology": { title: "Physiology", overview: "The science of life and homeostatic balance." },
                "Biochemistry": { title: "Biochemistry", overview: "Chemical processes within living organisms." }
            }
        },
        phase2: { name: "Dental Sciences", subjects: { "Materials": { title: "Dental Materials", overview: "Science of restorative materials." } } },
        phase3: { name: "Clinical Subjects", subjects: { "Operative": { title: "Operative Dentistry", overview: "Restorative procedures." } } },
        phase4: { name: "Clinical Thinking", subjects: { "Diagnostic": { title: "Diagnostic Workflow", overview: "Thinking like a dentist." } } }
    };

    function loadPhase(num) {
        const phase = curriculum['phase' + num];
        document.getElementById('phase-name').innerText = phase.name;
        
        const list = document.getElementById('subject-list');
        list.innerHTML = "";
        
        Object.keys(phase.subjects).forEach(sub => {
            const btn = document.createElement('div');
            btn.className = "sub-link";
            btn.innerText = sub;
            btn.onclick = () => renderContent(num, sub);
            list.appendChild(btn);
        });

        // Load icons active state
        document.querySelectorAll('.phase-icon').forEach((icon, i) => {
            icon.classList.toggle('active', (i+1) === num);
        });

        renderContent(num, Object.keys(phase.subjects)[0]);
    }

    function renderContent(pNum, sName) {
        const sub = curriculum['phase' + pNum].subjects[sName];
        let html = `<h1>${sub.title}</h1><p class="overview-text">📌 ${sub.overview}</p>`;

        if(sub.sections) {
            sub.sections.forEach(sec => {
                html += `<h2>${sec.title}</h2><div class="grid-2">`;
                sec.items.forEach(item => {
                    html += `<div class="clinical-box"><b>${item.h}</b><p>${item.p}</p></div>`;
                });
                html += `</div><div class="relevance-tag"><b>Clinical Relevance</b>${sec.relevance}</div>`;
            });
        }

        if(sub.nerves) html += sub.nerves;
        if(sub.blood) html += sub.blood;
        if(sub.table) html += sub.table;

        document.getElementById('content-render').innerHTML = html;
        
        document.querySelectorAll('.sub-link').forEach(link => {
            link.classList.toggle('active', link.innerText === sName);
        });
    }

    window.onload = () => loadPhase(1);
</script>

</body>
</html>
