<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Interactive Visual Anatomy</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --border: #e2e8f0; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        .app-container { display: grid; grid-template-columns: 80px 260px 1fr 340px; height: 100vh; }

        /* Navigation */
        .phase-rail { background: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .phase-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; font-size: 1.2rem; }
        .phase-icon.active { background: var(--brand); box-shadow: 0 0 20px var(--brand); }

        .sidebar { background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar-title { font-size: 0.65rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .sub-link { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
        .sub-link:hover, .sub-link.active { background: var(--brand-light); color: var(--brand); }

        .anatomy-menu { background: #f1f5f9; padding: 10px; border-radius: 12px; margin-top: 10px; display: none; }
        .anatomy-menu.active { display: block; }
        .topic-link { padding: 8px 10px; font-size: 0.75rem; font-weight: 700; color: var(--text-light); cursor: pointer; border-radius: 6px; display: block; margin-bottom: 2px; }
        .topic-link:hover { color: var(--brand); background: white; }
        .topic-link.active-topic { background: var(--brand); color: white; }

        /* Main Viewer */
        main.viewer { padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); width: 100%; max-width: 950px; border: 1px solid var(--border); height: fit-content; }

        /* --- IMAGE ZOOM SYSTEM --- */
        .image-container { 
            position: relative; 
            width: 100%; 
            margin: 20px 0; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 1px solid var(--border);
            cursor: zoom-in;
            background: #fff;
        }
        .image-container img { 
            width: 100%; 
            height: auto; 
            display: block; 
            transition: transform 0.5s ease;
        }
        .image-container:hover img {
            transform: scale(1.03);
        }
        .zoom-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            pointer-events: none;
        }

        /* Fullscreen Modal */
        #zoom-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        #modal-img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            transform: scale(1);
            transition: transform 0.3s;
        }
        #modal-img:active {
            transform: scale(1.5); /* Click and hold to zoom even more in modal */
        }
        .close-modal {
            position: absolute;
            top: 20px; right: 30px;
            color: white; font-size: 30px; font-weight: bold;
            cursor: pointer;
        }

        /* Content Styling */
        .osteo-nav { display: flex; gap: 8px; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; overflow-x: auto; }
        .osteo-btn { padding: 8px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 50px; cursor: pointer; font-size: 0.72rem; font-weight: 800; white-space: nowrap; }
        .osteo-btn.active-btn { background: var(--brand); color: white; border-color: var(--brand); }
        .mnemonic-box { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 12px; margin: 15px 0; color: #92400e; font-size: 0.85rem; }
        .clinical-box { background: #f8fafc; padding: 20px; border-radius: 15px; border-left: 5px solid var(--brand); margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th { background: #f1f5f9; text-align: left; padding: 12px; font-size: 0.75rem; border: 1px solid var(--border); }
        td { padding: 12px; border: 1px solid var(--border); font-size: 0.85rem; }

        .utility { background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        #notes { flex: 1; border: none; padding: 20px; background: #fffdf5; outline: none; resize: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<!-- ZOOM MODAL -->
<div id="zoom-modal" onclick="closeZoom()">
    <span class="close-modal">&times;</span>
    <img id="modal-img" src="" alt="Zoomed Image">
    <div style="position:absolute; bottom:20px; color:white; font-size:0.8rem;">Click anywhere to close | Hold click to Magnify</div>
</div>

<div class="app-container">
    <nav class="phase-rail">
        <div class="phase-icon active" onclick="loadPhase(1)"><i class="fa-solid fa-brain"></i></div>
        <div class="phase-icon" onclick="loadPhase(2)"><i class="fa-solid fa-tooth"></i></div>
        <div class="phase-icon" onclick="loadPhase(3)"><i class="fa-solid fa-toolbox"></i></div>
        <div class="phase-icon" onclick="loadPhase(4)"><i class="fa-solid fa-rotate"></i></div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-title" id="phase-title">Phase 1</div>
        <div id="subject-list"></div>
    </aside>

    <main class="viewer">
        <div id="render-target" class="card"></div>
    </main>

    <aside class="utility">
        <div style="padding:15px; font-weight:800; font-size:0.7rem; border-bottom:1px solid #eee;">DentoAI & NOTES</div>
        <div style="flex:1; background:#f1f5f9;">
            <iframe src="https://www.chatbase.co/chatbot-iframe/v_your_id" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <textarea id="notes" placeholder="Notes auto-save per topic..."></textarea>
    </aside>
</div>

<script>
    // Utility for Zoom
    function openZoom(src) {
        document.getElementById('modal-img').src = src;
        document.getElementById('zoom-modal').style.display = 'flex';
    }
    function closeZoom() {
        document.getElementById('zoom-modal').style.display = 'none';
    }

    const osteoSubTabs = {
        overview: `
            <h3>🧠 1. SKULL OVERVIEW</h3>
            <div class="image-container" onclick="openZoom('https://cdn.britannica.com/71/74271-050-E3E9773D/Lateral-views-human-skull.jpg')">
                <img src="https://cdn.britannica.com/71/74271-050-E3E9773D/Lateral-views-human-skull.jpg">
                <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> Click to Zoom</div>
            </div>
            <div class="clinical-box">Total skull bones: <b>22</b>. Note the suture lines connecting the cranial plates.</div>
        `,
        cranial: `
            <h3>🔢 CRANIAL BONES (8)</h3>
            <div class="image-container" onclick="openZoom('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTa90Dbo7nyT4dJnij6ZeeoW0EhFiG4xhD1Pw&s')">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTa90Dbo7nyT4dJnij6ZeeoW0EhFiG4xhD1Pw&s">
                <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> Click to Zoom</div>
            </div>
            <div class="mnemonic-box">👉 Mnemonic: “PEST OF 6” <br>(Parietal, Ethmoid, Sphenoid, Temporal, Occipital, Frontal)</div>
        `,
        facial: `
            <h3>🔢 FACIAL BONES (14)</h3>
            <div class="image-container" onclick="openZoom('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvXFaQkkuT_kQ0Op5LoCyPLBXW0SBKZ6NgLw&s')">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvXFaQkkuT_kQ0Op5LoCyPLBXW0SBKZ6NgLw&s">
                <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> Click to Zoom</div>
            </div>
            <div class="mnemonic-box">👉 Mnemonic: “Virgil Can Not Make My Pet Zebra Laugh”</div>
        `,
        mandible: `
            <h3>🦷 2. THE MANDIBLE</h3>
            <div class="image-container" onclick="openZoom('https://cdn.britannica.com/96/99196-050-ED0AA964/mandible.jpg')">
                <img src="https://cdn.britannica.com/96/99196-050-ED0AA964/mandible.jpg">
                <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> Click to Zoom</div>
            </div>
            <div class="clinical-box">Target the <b>Mandibular Foramen</b> for successful Inferior Alveolar Nerve blocks.</div>
        `
    };

    const curriculum = { phase1: { name: "Core Foundations", subjects: ["Anatomy", "Physiology", "Microbiology"] } };

    function loadPhase(num) {
        const phase = curriculum['phase' + num];
        document.getElementById('phase-title').innerText = phase.name;
        const list = document.getElementById('subject-list');
        list.innerHTML = "";
        
        phase.subjects.forEach(sub => {
            const container = document.createElement('div');
            const link = document.createElement('div');
            link.className = "sub-link";
            link.innerHTML = `<span>${sub}</span>` + (sub === 'Anatomy' ? `<i class="fa-solid fa-chevron-down"></i>` : "");
            link.onclick = () => (sub === 'Anatomy') ? toggleAnatomyMenu() : renderSubject(sub);
            container.appendChild(link);
            
            if(sub === 'Anatomy') {
                const subMenu = document.createElement('div');
                subMenu.className = "anatomy-menu";
                subMenu.id = "anatomy-submenu";
                const topics = ["Osteology", "Muscles", "TMJ", "Nerves"];
                topics.forEach(t => {
                    const tLink = document.createElement('div');
                    tLink.className = "topic-link";
                    tLink.innerText = t;
                    tLink.onclick = (e) => { e.stopPropagation(); renderAnatomyTopic(t); };
                    subMenu.appendChild(tLink);
                });
                container.appendChild(subMenu);
            }
            list.appendChild(container);
        });
        document.querySelectorAll('.phase-icon').forEach((icon, i) => icon.classList.toggle('active', (i+1) === num));
        renderSubject(phase.subjects[0]);
    }

    function toggleAnatomyMenu() {
        document.getElementById('anatomy-submenu').classList.toggle('active');
        renderAnatomyTopic("Osteology");
    }

    function renderAnatomyTopic(topic) {
        const target = document.getElementById('render-target');
        if (topic === "Osteology") {
            target.innerHTML = `
                <h1>Osteology Hub</h1>
                <div class="osteo-nav">
                    <button class="osteo-btn active-btn" onclick="switchOsteoTab(this, 'overview')">Skull Overview</button>
                    <button class="osteo-btn" onclick="switchOsteoTab(this, 'cranial')">Cranial Bones</button>
                    <button class="osteo-btn" onclick="switchOsteoTab(this, 'facial')">Facial Bones</button>
                    <button class="osteo-btn" onclick="switchOsteoTab(this, 'mandible')">Mandible</button>
                </div>
                <div id="osteo-content">${osteoSubTabs.overview}</div>
            `;
        } else {
            target.innerHTML = `<h1>${topic}</h1><p>Content coming soon...</p>`;
        }
        document.querySelectorAll('.topic-link').forEach(l => l.classList.toggle('active-topic', l.innerText === topic));
    }

    function switchOsteoTab(btn, tabId) {
        document.querySelectorAll('.osteo-btn').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
        document.getElementById('osteo-content').innerHTML = osteoSubTabs[tabId];
    }

    function renderSubject(sub) {
        const target = document.getElementById('render-target');
        if(sub !== 'Anatomy') document.getElementById('anatomy-submenu')?.classList.remove('active');
        target.innerHTML = `<h1>${sub}</h1><p>Loading ${sub} module...</p>`;
        document.querySelectorAll('.sub-link').forEach(l => l.classList.toggle('active', l.innerText === sub));
    }

    window.onload = () => loadPhase(1);
</script>
</body>
</html>
