<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Board Mastery & Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* --- LAYOUT --- */
        .app-container { display: grid; grid-template-columns: 80px 280px 1fr 340px; height: 100vh; }

        /* Navigation Sidebar */
        .phase-rail { background: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .phase-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; font-size: 1.2rem; }
        .phase-icon.active { background: var(--brand); box-shadow: 0 0 20px var(--brand); }

        .sidebar { background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
        .sub-link { padding: 12px 15px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 5px; transition: 0.2s; }
        .sub-link:hover, .sub-link.active { background: var(--brand-light); color: var(--brand); }

        /* Content Viewer */
        main.viewer { padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); width: 100%; max-width: 900px; border: 1px solid var(--border); height: fit-content; }

        /* --- CLINICAL CONTENT STYLING --- */
        .clinical-box { background: #f8fafc; padding: 20px; border-radius: 15px; border-left: 5px solid var(--brand); margin: 15px 0; }
        .clinical-box ul { margin-left: 20px; margin-top: 10px; }
        .exam-point { color: var(--danger); font-weight: 800; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- SMART QUIZ UI --- */
        .quiz-option { width: 100%; text-align: left; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: white; margin-top: 10px; cursor: pointer; transition: 0.2s; }
        .quiz-option:hover { background: var(--brand-light); }
        .quiz-option.correct { background: #dcfce7; border-color: var(--success); color: #166534; font-weight: 700; }
        .quiz-option.wrong { background: #fee2e2; border-color: var(--danger); color: #991b1b; }
        .rationale { margin-top: 20px; padding: 20px; background: #eff6ff; border-radius: 12px; border-left: 4px solid var(--brand); display: none; animation: fadeIn 0.3s; }

        /* --- PERFORMANCE DASHBOARD --- */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-card { padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .weak-badge { background: #fee2e2; color: #ef4444; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; }
        .strong-badge { background: #dcfce7; color: #10b981; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; }

        /* Utility */
        .utility { background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        #notes { flex: 1; border: none; padding: 20px; background: #fffdf5; outline: none; resize: none; font-size: 0.9rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="phase-rail">
        <div class="phase-icon active" onclick="loadPhase(1)"><i class="fa-solid fa-brain"></i></div>
        <div class="phase-icon" onclick="loadPhase(2)"><i class="fa-solid fa-tooth"></i></div>
        <div class="phase-icon" onclick="loadPhase(3)"><i class="fa-solid fa-toolbox"></i></div>
        <div class="phase-icon" onclick="loadPhase(4)"><i class="fa-solid fa-graduation-cap"></i></div>
    </nav>

    <aside class="sidebar">
        <div style="margin-bottom:20px;"><h2 style="font-size:1.2rem; color:var(--brand);">DentoGuide</h2></div>
        <div id="subject-list"></div>
        <hr style="margin: 20px 0; opacity: 0.1;">
        <div class="sub-link" onclick="renderPerformance()"><i class="fa-solid fa-chart-pie"></i> Analytics</div>
    </aside>

    <main class="viewer">
        <div id="render-target" class="card"></div>
    </main>

    <aside class="utility">
        <div style="padding:20px; font-weight:800; font-size:0.8rem; border-bottom:1px solid #eee;">PERSONAL STUDY NOTES</div>
        <textarea id="notes" placeholder="Notes auto-save per subject..."></textarea>
    </aside>
</div>

<script>
    // --- SMART PERFORMANCE TRACKING ---
    let performance = JSON.parse(localStorage.getItem("dento_performance")) || {};

    function trackAnswer(subject, isCorrect) {
        if(!performance[subject]) performance[subject] = {correct: 0, total: 0};
        performance[subject].total++;
        if(isCorrect) performance[subject].correct++;
        localStorage.setItem("dento_performance", JSON.stringify(performance));
    }

    const curriculum = {
        phase1: {
            name: "Core Foundations",
            subjects: {
                "Anatomy": {
                    title: "Head & Neck Mastery",
                    content: `
                        <h2>1. Skull & Osteology</h2>
                        <div class="clinical-box">
                            <b>Mandible</b>
                            <ul>
                                <li>Strongest facial bone</li>
                                <li>Articulates with temporal bone (TMJ)</li>
                                <li>Mandibular foramen → Inferior Alveolar Nerve</li>
                            </ul>
                        </div>
                        <h2>2. Muscles of Mastication</h2>
                        <div class="clinical-box">
                            <span class="exam-point">Mandatory Exam Point</span>
                            <ul>
                                <li>Masseter / Temporalis / Medial Pterygoid (Elevation)</li>
                                <li>Lateral Pterygoid (Opening/Protrusion)</li>
                            </ul>
                            <b>Innervation: CN V3</b>
                        </div>
                        <h2>3. Clinical Correlations</h2>
                        <div class="clinical-box">
                            <ul>
                                <li>Bell's Palsy → CN VII damage</li>
                                <li>Trismus → Lateral Pterygoid involvement</li>
                            </ul>
                        </div>`,
                    quiz: [
                        { q: "Patient has numb lower lip after extraction. Which nerve is involved?", options: ["Lingual", "Inferior Alveolar", "Buccal", "Facial"], a: 1, r: "The IAN gives off the mental nerve, which provides sensation to the lower lip." },
                        { q: "Damage to the Right CN XII (Hypoglossal) causes tongue deviation to the:", options: ["Left", "Right", "Does not deviate", "Center"], a: 1, r: "The tongue deviates TOWARD the side of the lesion in LMN injuries of CN XII." }
                    ]
                }
            }
        }
    };

    let activePhase = 1;
    let currentSub = "Anatomy";

    function loadPhase(num) {
        activePhase = num;
        const list = document.getElementById('subject-list');
        list.innerHTML = "";
        const phase = curriculum['phase'+num];
        if(!phase) return;
        
        Object.keys(phase.subjects).forEach(key => {
            const div = document.createElement('div');
            div.className = "sub-link";
            div.innerText = key;
            div.onclick = () => renderSubject(num, key);
            list.appendChild(div);
        });
        renderSubject(num, Object.keys(phase.subjects)[0]);
    }

    function renderSubject(pNum, sKey) {
        currentSub = sKey;
        const sub = curriculum['phase'+pNum].subjects[sKey];
        const target = document.getElementById('render-target');
        
        target.innerHTML = `<h1>${sub.title}</h1>${sub.content}`;
        
        if(sub.quiz) {
            target.innerHTML += `<h2>🧠 Board-Level MCQ</h2><div id="quiz-box"></div>`;
            loadQuiz(sub.quiz);
        }
        
        document.getElementById('notes').value = localStorage.getItem(`note_${sKey}`) || "";
        document.querySelectorAll('.sub-link').forEach(l => l.classList.toggle('active', l.innerText === sKey));
    }

    function loadQuiz(quiz) {
        let current = 0;
        function showQ() {
            const q = quiz[current];
            document.getElementById('quiz-box').innerHTML = `
                <div class="clinical-box">
                    <p><b>Q:</b> ${q.q}</p>
                    ${q.options.map((opt, i) => `<button class="quiz-option" onclick="check(${i})">${opt}</button>`).join('')}
                    <div id="rat-box" class="rationale"><b>Rationale:</b> ${q.r}</div>
                    <button id="next-q" style="display:none; margin-top:15px; padding:10px; cursor:pointer;" onclick="next()">Next Question</button>
                </div>`;
        }
        window.check = (idx) => {
            const correct = (idx === quiz[current].a);
            trackAnswer(currentSub, correct);
            document.querySelectorAll('.quiz-option').forEach((b, i) => {
                if(i === quiz[current].a) b.classList.add('correct');
                else if(i === idx) b.classList.add('wrong');
                b.style.pointerEvents = 'none';
            });
            document.getElementById('rat-box').style.display = 'block';
            document.getElementById('next-q').style.display = 'block';
        };
        window.next = () => { current++; if(current < quiz.length) showQ(); else renderPerformance(); };
        showQ();
    }

    function renderPerformance() {
        const target = document.getElementById('render-target');
        let html = `<h1>Performance Analytics</h1><div class="stat-grid">`;
        for(let sub in performance) {
            let rate = (performance[sub].correct / performance[sub].total) * 100;
            let status = rate < 70 ? `<span class="weak-badge">Weak Area</span>` : `<span class="strong-badge">Mastered</span>`;
            html += `<div class="stat-card"><h3>${sub}</h3><p>${rate.toFixed(1)}% Accuracy</p>${status}</div>`;
        }
        target.innerHTML = html + `</div>`;
    }

    document.getElementById('notes').addEventListener('input', (e) => {
        localStorage.setItem(`note_${currentSub}`, e.target.value);
    });

    window.onload = () => loadPhase(1);
</script>
</body>
</html>
