<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Clinical Mastery Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        /* --- LAYOUT --- */
        .app-container { display: grid; grid-template-columns: 80px 240px 1fr 320px; height: 100vh; }

        /* Phase Rail (Icons Only) */
        .phase-rail { background: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .phase-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; font-size: 1.2rem; }
        .phase-icon:hover { background: var(--brand); }
        .phase-icon.active { background: var(--brand); box-shadow: 0 0 15px var(--brand); }

        /* Subject Sidebar */
        .subject-sidebar { background: white; border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
        .sidebar-title { font-size: 0.65rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .sub-link { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 4px; display: block; transition: 0.2s; }
        .sub-link:hover { background: var(--brand-light); color: var(--brand); }
        .sub-link.active { background: var(--brand-light); color: var(--brand); }

        /* Main Content */
        main.content-view { padding: 40px; overflow-y: auto; background: var(--bg); }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); max-width: 900px; margin: 0 auto; }
        
        /* Clinical Framework Styling */
        .framework-section { margin-top: 30px; }
        .framework-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .f-item { background: #f8fafc; padding: 20px; border-radius: 12px; border-left: 4px solid var(--brand); }
        .f-item h5 { font-size: 0.7rem; color: var(--brand); text-transform: uppercase; margin-bottom: 8px; }

        /* AI & Notes Panel */
        .utility-panel { background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .ai-header { padding: 20px; background: var(--brand); color: white; font-weight: 800; font-size: 0.9rem; }
        .ai-chat { flex: 1; border-bottom: 1px solid var(--border); }
        textarea#personal-notes { height: 200px; padding: 20px; border: none; outline: none; background: #fffdf5; font-size: 0.85rem; resize: none; }

        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
        .badge { display: inline-block; padding: 4px 12px; background: var(--brand-light); color: var(--brand); border-radius: 20px; font-size: 0.7rem; font-weight: 800; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- PHASE RAIL (Step 1) -->
    <nav class="phase-rail">
        <div class="phase-icon active" onclick="switchPhase(1)" title="Foundations"><i class="fa-solid fa-brain"></i></div>
        <div class="phase-icon" onclick="switchPhase(2)" title="Dental Sciences"><i class="fa-solid fa-tooth"></i></div>
        <div class="phase-icon" onclick="switchPhase(3)" title="Clinical Subjects"><i class="fa-solid fa-toolbox"></i></div>
        <div class="phase-icon" onclick="switchPhase(4)" title="Clinical Thinking"><i class="fa-solid fa-rotate"></i></div>
    </nav>

    <!-- SUBJECT SIDEBAR (Step 2) -->
    <aside class="subject-sidebar">
        <div class="sidebar-title" id="phase-title">Foundations</div>
        <div id="subject-list">
            <!-- Subjects injected by JS -->
        </div>
    </aside>

    <!-- MAIN VIEWER (Step 3) -->
    <main class="content-view">
        <div id="render-target"></div>
    </main>

    <!-- UTILITY PANEL -->
    <aside class="utility-panel">
        <div class="ai-header">DentoAI Assistant</div>
        <div class="ai-chat">
            <!-- Chatbase Iframe would go here -->
            <iframe src="https://www.chatbase.co/chatbot-iframe/v_your_id" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <div style="padding:10px; font-size:0.65rem; font-weight:800; color:var(--text-light);">MY PERSISTENT NOTES</div>
        <textarea id="personal-notes" placeholder="Notes auto-save for this subject..."></textarea>
    </aside>
</div>

<script>
    const curriculum = {
        phase1: {
            name: "Core Foundations",
            subjects: ["Anatomy", "Physiology", "Biochemistry", "Histology", "Microbiology", "Pathology"],
            data: {
                Anatomy: { 
                    title: "Head & Neck Anatomy", 
                    content: `<h3>Pre-Clinical Mastery</h3><p>Essential structures for anesthesia and surgery.</p>
                    <div class="f-item" style="margin-top:20px;"><h5>💡 Mnemonic</h5><p>Standing Room Only (V1, V2, V3 foramina exits).</p></div>`
                },
                Physiology: { title: "Physiology", content: "<p>The study of homeostatic mechanisms and salivary function.</p>" }
            }
        },
        phase2: {
            name: "Dental Sciences",
            subjects: ["Dental Anatomy", "Oral Histology", "Oral Pathology", "Dental Materials", "Pharmacology"],
            data: {
                "Dental Materials": { 
                    title: "Dental Materials Science", 
                    content: "<h3>High-Yield Tables</h3><p>Compare setting times and expansion for Gypsum products.</p>" 
                }
            }
        },
        phase3: {
            name: "Clinical Subjects",
            subjects: ["Operative", "Prosthodontics", "Endodontics", "Periodontics", "Oral Surgery", "Orthodontics", "Pediatrics"],
            data: {
                Operative: {
                    title: "Operative Dentistry",
                    content: `
                    <div class="framework-section">
                        <div class="framework-grid">
                            <div class="f-item"><h5>1. Definition</h5>Restoration of form and function of the tooth.</div>
                            <div class="f-item"><h5>2. Indications</h5>Caries, Fractures, Trauma, Aesthetics.</div>
                            <div class="f-item"><h5>3. Steps</h5>Access -> Preparation -> Matrix -> Fill -> Finish.</div>
                            <div class="f-item"><h5>4. Viva Question</h5>Why use a 90° cavosurface angle for Amalgam?</div>
                        </div>
                    </div>`
                }
            }
        },
        phase4: {
            name: "Clinical Thinking",
            subjects: ["Diagnostic Workflow", "Case Studies", "Decision Trees"],
            data: {
                "Diagnostic Workflow": {
                    title: "Diagnostic Thinking Framework",
                    content: `
                    <div class="f-item" style="border-color: #10b981;">
                        <h5>The 5-Step Process</h5>
                        <p>1. Chief Complaint<br>2. History<br>3. Examination<br>4. Diagnosis<br>5. Treatment Plan</p>
                    </div>`
                }
            }
        }
    };

    let activePhase = 1;

    function switchPhase(phaseNum) {
        activePhase = phaseNum;
        const phaseKey = 'phase' + phaseNum;
        const phase = curriculum[phaseKey];

        // Update Icons
        document.querySelectorAll('.phase-icon').forEach((icon, idx) => {
            icon.classList.toggle('active', (idx + 1) === phaseNum);
        });

        // Update Sidebar
        document.getElementById('phase-title').innerText = phase.name;
        const list = document.getElementById('subject-list');
        list.innerHTML = "";
        
        phase.subjects.forEach(sub => {
            const item = document.createElement('div');
            item.className = "sub-link";
            item.innerText = sub;
            item.onclick = () => renderSubject(phaseKey, sub);
            list.appendChild(item);
        });

        // Load first subject automatically
        renderSubject(phaseKey, phase.subjects[0]);
    }

    function renderSubject(pKey, sKey) {
        const subjectData = curriculum[pKey].data[sKey] || { title: sKey, content: "<p>Content for this module is being prepared.</p>" };
        
        // Update Sidebar UI
        document.querySelectorAll('.sub-link').forEach(link => {
            link.classList.toggle('active', link.innerText === sKey);
        });

        document.getElementById('render-target').innerHTML = `
            <div class="card">
                <div class="badge">${curriculum[pKey].name}</div>
                <h1>${subjectData.title}</h1>
                <hr style="opacity:0.1; margin-bottom:20px;">
                ${subjectData.content}
            </div>
        `;

        // Load persistent notes
        document.getElementById('personal-notes').value = localStorage.getItem(`note_${sKey}`) || "";
    }

    // Auto-save notes
    document.getElementById('personal-notes').addEventListener('input', (e) => {
        const activeSub = document.querySelector('.sub-link.active').innerText;
        localStorage.setItem(`note_${activeSub}`, e.target.value);
    });

    // Initialize
    window.onload = () => switchPhase(1);

</script>
</body>
</html>
