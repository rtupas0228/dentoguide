<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Complete Osteology Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --border: #e2e8f0; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        .app-container { display: grid; grid-template-columns: 80px 260px 1fr 340px; height: 100vh; }

        /* Navigation Rail */
        .phase-rail { background: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .phase-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; font-size: 1.2rem; }
        .phase-icon.active { background: var(--brand); box-shadow: 0 0 20px var(--brand); }

        /* Sidebar */
        .sidebar { background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar-title { font-size: 0.65rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .sub-link { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .sub-link:hover, .sub-link.active { background: var(--brand-light); color: var(--brand); }

        .anatomy-menu { background: #f1f5f9; padding: 10px; border-radius: 12px; margin-top: 10px; display: none; }
        .anatomy-menu.active { display: block; }
        .topic-link { padding: 8px 10px; font-size: 0.75rem; font-weight: 700; color: var(--text-light); cursor: pointer; border-radius: 6px; display: block; margin-bottom: 2px; }
        .topic-link:hover { color: var(--brand); background: white; }
        .topic-link.active-topic { background: var(--brand); color: white; }

        /* Main Viewer */
        main.viewer { padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); width: 100%; max-width: 950px; border: 1px solid var(--border); height: fit-content; }

        /* OSTEOLOGY NAV */
        .osteo-nav { display: flex; gap: 8px; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; overflow-x: auto; }
        .osteo-btn { padding: 8px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 50px; cursor: pointer; font-size: 0.72rem; font-weight: 800; white-space: nowrap; transition: 0.2s; }
        .osteo-btn:hover { border-color: var(--brand); color: var(--brand); }
        .osteo-btn.active-btn { background: var(--brand); color: white; border-color: var(--brand); }

        /* Components */
        .image-box { width: 100%; margin: 20px 0; border-radius: 15px; overflow: hidden; border: 1px solid var(--border); background: #fff; text-align: center; }
        .image-box img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 20px 0; }
        .stat-card { background: var(--brand); color: white; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-card h1 { font-size: 1.5rem; margin: 0; }
        .stat-card p { font-size: 0.6rem; text-transform: uppercase; font-weight: 800; opacity: 0.9; }

        .mnemonic-box { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 12px; margin: 15px 0; color: #92400e; font-weight: 600; font-size: 0.85rem; }
        .clinical-box { background: #f8fafc; padding: 20px; border-radius: 15px; border-left: 5px solid var(--brand); margin-bottom: 15px; }
        .clinical-box b { color: var(--brand); display: block; margin-bottom: 5px; text-transform: uppercase; font-size: 0.75rem; }

        .tag { padding: 4px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin-right: 5px; }
        .tag-red { background: #fee2e2; color: #ef4444; }
        .tag-blue { background: #eff6ff; color: #2563eb; }
        .tag-yellow { background: #fef9c3; color: #ca8a04; }
        .tag-green { background: #dcfce7; color: #16a34a; }

        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th { background: #f1f5f9; text-align: left; padding: 12px; font-size: 0.75rem; border: 1px solid var(--border); text-transform: uppercase; }
        td { padding: 12px; border: 1px solid var(--border); font-size: 0.85rem; }

        /* Utility */
        .utility { background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        #notes { flex: 1; border: none; padding: 20px; background: #fffdf5; outline: none; resize: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="phase-rail">
        <div class="phase-icon active" onclick="loadPhase(1)"><i class="fa-solid fa-brain"></i></div>
        <div class="phase-icon" onclick="loadPhase(2)"><i class="fa-solid fa-tooth"></i></div>
        <div class="phase-icon" onclick="loadPhase(3)"><i class="fa-solid fa-toolbox"></i></div>
        <div class="phase-icon" onclick="loadPhase(4)"><i class="fa-solid fa-rotate"></i></div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-title" id="phase-title">Phase 1</div>
        <div id="subject-list"></div>
    </aside>

    <main class="viewer">
        <div id="render-target" class="card"></div>
    </main>

    <aside class="utility">
        <div style="padding:15px; font-weight:800; font-size:0.7rem; border-bottom:1px solid #eee;">DentoAI & NOTES</div>
        <div style="flex:1; background:#f1f5f9;">
            <iframe src="https://www.chatbase.co/chatbot-iframe/v_your_id" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <textarea id="notes" placeholder="Notes auto-save per topic..."></textarea>
    </aside>
</div>

<script>
    const osteoSubTabs = {
        overview: `
            <h3>🧠 1. SKULL OVERVIEW (HIGH-YIELD)</h3>
            <div class="image-box">
                <img src="https://cdn.britannica.com/71/74271-050-E3E9773D/Lateral-views-human-skull.jpg" alt="Skull Lateral View">
            </div>
            <div class="stat-grid">
                <div class="stat-card"><h1>22</h1><p>Total Bones</p></div>
                <div class="stat-card"><h1>8</h1><p>Cranial</p></div>
                <div class="stat-card"><h1>14</h1><p>Facial</p></div>
                <div class="stat-card"><h1>32</h1><p>Adult Teeth</p></div>
            </div>
            <div class="clinical-box">
                <b>Skull Structure</b>
                Only 1 movable bone: Mandible. Strongest facial bone: Mandible.
            </div>
        `,
        cranial: `
            <h3>🔢 CRANIAL BONES (8)</h3>
            <div class="image-box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTa90Dbo7nyT4dJnij6ZeeoW0EhFiG4xhD1Pw&s" alt="Cranial Bones"></div>
            <p>Frontal (1), Parietal (2), Temporal (2), Occipital (1), Sphenoid (1), Ethmoid (1)</p>
            <div class="mnemonic-box">👉 Mnemonic: “PEST OF 6” <br>(Parietal, Ethmoid, Sphenoid, Temporal, Occipital, Frontal)</div>
        `,
        facial: `
            <h3>🔢 FACIAL BONES (14) & MAXILLA</h3>
            <div class="image-box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvXFaQkkuT_kQ0Op5LoCyPLBXW0SBKZ6NgLw&s" alt="Facial Bones"></div>
            <div class="mnemonic-box">👉 Mnemonic: “Virgil Can Not Make My Pet Zebra Laugh”</div>
            <div class="clinical-box" style="border-color: var(--brand);">
                <b>🧠 MAXILLA (Clinical Importance)</b>
                <ul>
                    <li>Forms upper jaw and contains <b>Maxillary Sinus</b>.</li>
                    <li>👉 Clinical: Sinus infections → Tooth pain.</li>
                    <li>👉 Clinical: Extractions → Sinus perforation risk.</li>
                </ul>
            </div>
        `,
        mandible: `
            <h3>🦷 2. THE MANDIBLE (PARTS & LANDMARKS)</h3>
            <div class="image-box"><img src="https://cdn.britannica.com/96/99196-050-ED0AA964/mandible.jpg" alt="Mandible Diagram"></div>
            
            <div class="stat-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
                <div class="stat-card" style="background:var(--text-light);"><h1>Body</h1></div>
                <div class="stat-card" style="background:var(--text-light);"><h1>Ramus</h1></div>
                <div class="stat-card" style="background:var(--text-light);"><h1>Angle</h1></div>
                <div class="stat-card" style="background:var(--text-light);"><h1>Alveolar</h1></div>
            </div>

            <h4>📍 LANDMARKS (EXAM GOLD)</h4>
            <div class="clinical-box" style="border-color:var(--danger);">
                <span class="tag tag-red">🔴 Mandibular Foramen</span>
                Medial ramus. Entry of <b>Inferior Alveolar Nerve (IAN)</b>. Target for IAN Block.
            </div>
            <div class="clinical-box" style="border-color:var(--brand);">
                <span class="tag tag-blue">🔵 Mental Foramen</span>
                Near premolars. Exit of mental nerve. <br>👉 Mnemonic: “Mental = Mouth Exit”
            </div>
            <div class="clinical-box" style="border-color:var(--warning);">
                <span class="tag tag-yellow">🟡 Lingula</span>
                Tongue-shaped projection. Landmark for anesthesia.
            </div>
            <div class="clinical-box" style="border-color:var(--success);">
                <span class="tag tag-green">🟢 Mylohyoid Line</span>
                Attachment for the mylohyoid muscle.
            </div>

            <h3>🧬 4. DEVELOPMENT</h3>
            <p><b>Origin:</b> First pharyngeal arch.</p>
            <p><b>Ossification:</b> Intramembranous ossification.</p>
            <div class="mnemonic-box">
                <b>Related to: Johann Friedrich Meckel</b><br>
                “Meckel’s cartilage” guides development. Maxilla also from 1st arch.
            </div>
        `,
        examprep: `
            <h3>📊 OSTEOLOGY EXAM PREP</h3>
            
            <h4>🧠 OSSIFICATION TYPES</h4>
            <table>
                <tr><th>Type</th><th>Example</th><th>Mnemonic</th></tr>
                <tr><td>Intramembranous</td><td>Mandible, Maxilla</td><td>Face = Membrane</td></tr>
                <tr><td>Endochondral</td><td>Base of Skull</td><td>Base = Cartilage</td></tr>
            </table>

            <h4>⚡ IMPORTANT FORAMINA</h4>
            <table>
                <tr><th>Foramen</th><th>Structure Passing</th><th>Clinical</th></tr>
                <tr><td>Mandibular</td><td>IAN</td><td>Nerve block</td></tr>
                <tr><td>Mental</td><td>Mental nerve</td><td>Lip numbness</td></tr>
                <tr><td>Infraorbital</td><td>Infraorbital nerve</td><td>Midface anesthesia</td></tr>
                <tr><td>Ovale</td><td>CN V3</td><td>Mastication</td></tr>
            </table>

            <h4>🧠 MUSCLE ATTACHMENTS</h4>
            <table>
                <tr><th>Muscle</th><th>Attachment</th></tr>
                <tr><td>Masseter</td><td>Angle of mandible</td></tr>
                <tr><td>Temporalis</td><td>Coronoid process</td></tr>
                <tr><td>Medial Pterygoid</td><td>Inner angle</td></tr>
                <tr><td>Lateral Pterygoid</td><td>Condyle</td></tr>
            </table>

            <h4>🔥 CLINICAL CORRELATIONS</h4>
            <div class="clinical-box" style="border-color:var(--danger);">
                <b>❗ Fracture Sites (Weak Areas)</b>
                Condyle, Angle, Parasymphysis. 👉 Mnemonic: “CAP breaks easily”
            </div>
            <p><b>IAN damage:</b> Lower lip numbness. <b>Dry Socket:</b> Bone healing risk.</p>

            <h4>📚 DISCOVERIES</h4>
            <ul>
                <li><b>Andreas Vesalius:</b> Father of modern anatomy.</li>
                <li><b>Henry Gray:</b> Gray's Anatomy.</li>
                <li><b>Johann Friedrich Meckel:</b> Meckel’s cartilage.</li>
            </ul>

            <div class="mnemonic-box" style="background:var(--text); color:white; border:none;">
                <h3 style="color:var(--success);">🎯 ULTRA-HIGH YIELD SUMMARY</h3>
                <p>If exam is tomorrow, remember ONLY this:</p>
                <ul style="margin-left:20px; font-size:0.8rem; line-height:1.8;">
                    <li>Mandible = movable + strongest</li>
                    <li>Mandibular foramen = IAN</li>
                    <li>Mental foramen = lip sensation</li>
                    <li>CN V3 = mastication</li>
                    <li>Maxilla = sinus risk</li>
                    <li>Ludwig’s angina = airway emergency</li>
                </ul>
            </div>
        `
    };

    const anatomyData = { "Osteology": { title: "Osteology Hub" } };
    const curriculum = { phase1: { name: "Core Foundations", subjects: ["Anatomy", "Physiology", "Biochemistry", "Histology", "Microbiology", "Pathology"] } };

    function loadPhase(num) {
        const phase = curriculum['phase' + num];
        document.getElementById('phase-title').innerText = phase.name;
        const list = document.getElementById('subject-list');
        list.innerHTML = "";
        
        phase.subjects.forEach(sub => {
            const container = document.createElement('div');
            const link = document.createElement('div');
            link.className = "sub-link";
            link.innerHTML = `<span>${sub}</span>` + (sub === 'Anatomy' ? `<i class="fa-solid fa-chevron-down"></i>` : "");
            link.onclick = () => (sub === 'Anatomy') ? toggleAnatomyMenu() : renderSubject(sub);
            container.appendChild(link);
            
            if(sub === 'Anatomy') {
                const subMenu = document.createElement('div');
                subMenu.className = "anatomy-menu";
                subMenu.id = "anatomy-submenu";
                const topics = ["Osteology", "Muscles", "TMJ", "Cranial Nerves", "Blood Supply", "Venous Drainage", "Lymphatics", "Salivary Glands", "Fascial Spaces", "Oral Cavity", "Tongue", "Pharynx", "Clinical Correlations"];
                topics.forEach(t => {
                    const tLink = document.createElement('div');
                    tLink.className = "topic-link";
                    tLink.innerText = t;
                    tLink.onclick = (e) => { e.stopPropagation(); renderAnatomyTopic(t); };
                    subMenu.appendChild(tLink);
                });
                container.appendChild(subMenu);
            }
            list.appendChild(container);
        });
        document.querySelectorAll('.phase-icon').forEach((icon, i) => icon.classList.toggle('active', (i+1) === num));
        renderSubject(phase.subjects[0]);
    }

    function toggleAnatomyMenu() {
        document.getElementById('anatomy-submenu').classList.toggle('active');
        renderAnatomyTopic("Osteology");
    }

    function renderAnatomyTopic(topic) {
        const target = document.getElementById('render-target');
        if (topic === "Osteology") {
            target.innerHTML = `
                <h1>Osteology Mastery Hub</h1>
                <div class="osteo-nav">
                    <button class="osteo-btn active-btn" onclick="switchOsteoTab(this, 'overview')">Skull Overview</button>
                    <button class="osteo-btn" onclick="switchOsteoTab(this, 'cranial')">Cranial Bones</button>
                    <button class="osteo-btn" onclick="switchOsteoTab(this, 'facial')">Facial Bones / Maxilla</button>
                    <button class="osteo-btn" onclick="switchOsteoTab(this, 'mandible')">Mandible & Development</button>
                    <button class="osteo-btn" onclick="switchOsteoTab(this, 'examprep')" style="color:var(--danger)">🔥 Exam Prep Hub</button>
                </div>
                <div id="osteo-content">${osteoSubTabs.overview}</div>
            `;
        } else {
            target.innerHTML = `<h1>${topic}</h1><p>Content for ${topic} is coming soon.</p>`;
        }
        document.querySelectorAll('.topic-link').forEach(l => l.classList.toggle('active-topic', l.innerText === topic));
    }

    function switchOsteoTab(btn, tabId) {
        document.querySelectorAll('.osteo-btn').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
        document.getElementById('osteo-content').innerHTML = osteoSubTabs[tabId];
    }

    function renderSubject(sub) {
        const target = document.getElementById('render-target');
        if(sub !== 'Anatomy') document.getElementById('anatomy-submenu')?.classList.remove('active');
        target.innerHTML = `<h1>${sub}</h1><p>Module content for ${sub} is loading...</p>`;
        document.querySelectorAll('.sub-link').forEach(l => l.classList.toggle('active', l.innerText === sub));
    }

    window.onload = () => loadPhase(1);
</script>
</body>
</html>
