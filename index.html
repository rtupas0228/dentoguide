<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Clinical Mastery Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --border: #e2e8f0; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* --- APP LAYOUT --- */
        .app-container { display: grid; grid-template-columns: 80px 260px 1fr 340px; height: 100vh; }

        /* Phase Rail */
        .phase-rail { background: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .phase-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; font-size: 1.2rem; }
        .phase-icon.active { background: var(--brand); box-shadow: 0 0 20px var(--brand); }

        /* Sidebar Navigation */
        .sidebar { background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar-title { font-size: 0.65rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .sub-link { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .sub-link.active { background: var(--brand-light); color: var(--brand); }

        /* Sub-Menu Styles */
        .anatomy-submenu { margin-top: 5px; padding-left: 10px; border-left: 2px solid var(--border); display: none; }
        .anatomy-submenu.active { display: block; }
        .topic-link { padding: 6px 10px; font-size: 0.75rem; font-weight: 700; color: var(--text-light); cursor: pointer; border-radius: 6px; display: block; margin-bottom: 2px; }
        .topic-link.active-topic { color: var(--brand); background: var(--brand-light); }

        /* Main Content View */
        main.viewer { padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); width: 100%; max-width: 950px; border: 1px solid var(--border); height: fit-content; min-height: 90%; }

        /* Content Components */
        .image-container { position: relative; width: 100%; margin: 20px 0; border-radius: 15px; overflow: hidden; border: 1px solid var(--border); cursor: zoom-in; }
        .image-container img { width: 100%; height: auto; display: block; transition: transform 0.5s; }
        .image-container:hover img { transform: scale(1.02); }

        .nested-tab-nav { display: flex; gap: 8px; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; overflow-x: auto; }
        .tab-btn { padding: 8px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 50px; cursor: pointer; font-size: 0.7rem; font-weight: 800; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active-tab { background: var(--brand); color: white; border-color: var(--brand); }

        .mnemonic-box { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 12px; margin: 15px 0; color: #92400e; font-size: 0.85rem; font-weight: 600; }
        .clinical-box { background: #f8fafc; padding: 20px; border-radius: 15px; border-left: 5px solid var(--brand); margin-bottom: 15px; font-size: 0.9rem; }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; margin-right: 5px; }
        .t-red { background: #fee2e2; color: #ef4444; }

        /* Zoom Modal */
        #zoom-modal { display: none; position: fixed; z-index: 10000; inset: 0; background: rgba(15, 23, 42, 0.95); align-items: center; justify-content: center; cursor: zoom-out; }
        #modal-img { max-width: 90%; max-height: 90%; border-radius: 10px; }

        /* --- AI CHAT INTERFACE --- */
        .utility { background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .ai-header { padding: 15px; font-weight: 800; font-size: 0.75rem; border-bottom: 1px solid #eee; color: var(--brand); display: flex; align-items: center; gap: 8px; }
        
        #ai-chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #f8fafc; }
        .msg { padding: 10px 12px; border-radius: 12px; font-size: 0.8rem; line-height: 1.4; max-width: 85%; }
        .msg.bot { background: white; border: 1px solid var(--border); align-self: flex-start; color: var(--text); border-bottom-left-radius: 2px; }
        .msg.user { background: var(--brand); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        .ai-input-area { padding: 10px; border-top: 1px solid #eee; display: flex; gap: 5px; background: white; }
        #ai-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); outline: none; font-size: 0.8rem; }
        .ai-send-btn { background: var(--brand); color: white; border: none; width: 40px; border-radius: 8px; cursor: pointer; }

        #notes { height: 160px; border: none; border-top: 1px solid #eee; padding: 15px; font-size: 0.85rem; background: #fffdf5; outline: none; resize: none; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.85rem; }
        th { background: #f1f5f9; text-align: left; padding: 10px; border: 1px solid var(--border); }
        td { padding: 10px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="zoom-modal" onclick="this.style.display='none'">
    <img id="modal-img" src="">
</div>

<div class="app-container">
    <nav class="phase-rail">
        <div class="phase-icon active" onclick="loadPhase(1)"><i class="fa-solid fa-brain"></i></div>
        <div class="phase-icon" onclick="loadPhase(2)"><i class="fa-solid fa-tooth"></i></div>
        <div class="phase-icon" onclick="loadPhase(3)"><i class="fa-solid fa-toolbox"></i></div>
        <div class="phase-icon" onclick="loadPhase(4)"><i class="fa-solid fa-rotate"></i></div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-title" id="phase-title">Phase 1</div>
        <div id="subject-list"></div>
    </aside>

    <main class="viewer">
        <div id="render-target" class="card"></div>
    </main>

    <aside class="utility">
        <div class="ai-header"><i class="fa-solid fa-robot"></i> DENTOAI ASSISTANT</div>
        
        <!-- FUNCTIONAL AI CHAT -->
        <div id="ai-chat-window">
            <div class="msg bot">Hello! I'm DentoAI. Ask me about Skull bones, Mastication, or TMJ measurements!</div>
        </div>
        
        <div class="ai-input-area">
            <input type="text" id="ai-input" placeholder="Type a question..." onkeypress="if(event.key==='Enter') askDentoAI()">
            <button class="ai-send-btn" onclick="askDentoAI()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <div style="padding:10px; font-weight:800; font-size:0.65rem; color:#94a3b8; letter-spacing:1px;">MY PERSISTENT NOTES</div>
        <textarea id="notes" placeholder="Notes save per module..."></textarea>
    </aside>
</div>

<script>
    // --- DATABASE ---
    const osteoTabs = {
        overview: `<h3>🧠 1. SKULL OVERVIEW</h3><div class="image-container" onclick="openZoom('https://cdn.britannica.com/71/74271-050-E3E9773D/Lateral-views-human-skull.jpg')"><img src="https://cdn.britannica.com/71/74271-050-E3E9773D/Lateral-views-human-skull.jpg"></div><div class="clinical-box">Total: 22 bones | Cranial: 8 | Facial: 14</div>`,
        mandible: `<h3>🦷 2. MANDIBLE & MAXILLA</h3><div class="image-container" onclick="openZoom('https://cdn.britannica.com/96/99196-050-ED0AA964/mandible.jpg')"><img src="https://cdn.britannica.com/96/99196-050-ED0AA964/mandible.jpg"></div><div class="clinical-box"><span class="tag t-red">🔴 Mandibular Foramen</span> IAN Block Target.</div>`,
        examprep: `<h3>⚡ EXAM PREP</h3><div class="mnemonic-box">🎯 ULTRA-HIGH YIELD SUMMARY: Mandible = strongest/movable. IAN = Mandibular Foramen.</div>`
    };

    const muscleTabs = {
        general: `<h3>🧠 1. MUSCLE OVERVIEW</h3><div class="image-container" onclick="openZoom('https://image1.slideserve.com/2447927/head-and-neck-muscles-l.jpg')"><img src="https://image1.slideserve.com/2447927/head-and-neck-muscles-l.jpg"></div>`,
        mastication: `<h3>🔥 2. MASTICATION</h3><div class="mnemonic-box">👉 “M&M Tastes Like Pizza”: Masseter, Medial Pterygoid, Temporalis, Lateral Pterygoid.</div>`,
        expression: `<h3>🎭 3. EXPRESSION</h3><div class="image-container" onclick="openZoom('https://cdn.3d4medical.com/website/blog/facial-expression/facial-expression0.jpg')"><img src="https://cdn.3d4medical.com/website/blog/facial-expression/facial-expression0.jpg"></div>`
    };

    const tmjTabs = {
        overview: `<h3>🧠 1. TMJ BONES</h3><div class="image-container" onclick="openZoom('https://my.clevelandclinic.org/-/scassets/Images/org/health/articles/15066-tmj-disorder')"><img src="https://my.clevelandclinic.org/-/scassets/Images/org/health/articles/15066-tmj-disorder"></div>`
    };

    const curriculum = { phase1: { name: "Core Foundations", subjects: ["Anatomy", "Physiology", "Microbiology"] } };

    // --- AI LOGIC (LOCAL BRAIN) ---
    const dentalKnowledge = [
        { keys: ["how many", "skull", "bones"], ans: "The skull has 22 bones total: 8 cranial and 14 facial." },
        { keys: ["mnemonic", "cranial"], ans: "The mnemonic is 'PEST OF 6': Parietal, Ethmoid, Sphenoid, Temporal, Occipital, Frontal." },
        { keys: ["ian", "mandibular", "foramen"], ans: "The Mandibular Foramen is located on the medial ramus. It's the entry for the IAN and the primary target for an IAN block." },
        { keys: ["mental", "foramen"], ans: "The Mental Foramen is located near the premolars. It's the exit for the mental nerve. Mnemonic: 'Mental = Mouth Exit'." },
        { keys: ["open", "jaw", "mouth"], ans: "The Lateral Pterygoid is the ONLY muscle of mastication that opens the mouth. Mnemonic: 'Lateral = Lowers'." },
        { keys: ["mastication", "muscles"], ans: "There are 4: Masseter, Medial Pterygoid, Temporalis, and Lateral Pterygoid. Innervated by CN V3." },
        { keys: ["bell", "palsy", "facial"], ans: "Bell's Palsy is caused by damage to CN VII (Facial Nerve). Symptoms include facial drooping and inability to close the eye." },
        { keys: ["tmj", "cartilage", "disc"], ans: "Unique feature: The TMJ has an articular disc made of FIBROCARTILAGE, not hyaline cartilage." },
        { keys: ["measurement", "opening"], ans: "Normal mouth opening is 35-45 mm. Trismus is defined as less than 35 mm." },
        { keys: ["tongue", "lesion"], ans: "In a CN XII (Hypoglossal) lesion, the tongue deviates TOWARD the side of the lesion." }
    ];

    function askDentoAI() {
        const input = document.getElementById('ai-input');
        const chatWindow = document.getElementById('ai-chat-window');
        const query = input.value.toLowerCase();
        if (!query) return;

        // Add user message
        chatWindow.innerHTML += `<div class="msg user">${input.value}</div>`;
        input.value = "";

        // Bot logic
        setTimeout(() => {
            let response = "I'm sorry, I don't have information on that yet. Try asking about 'Skull bones', 'IAN block', 'Opening the jaw', or 'TMJ'.";
            
            for (let item of dentalKnowledge) {
                if (item.keys.some(k => query.includes(query.includes(k) ? k : null))) {
                    let matchCount = item.keys.filter(k => query.includes(k)).length;
                    if(matchCount >= 1) { response = item.ans; break; }
                }
            }

            chatWindow.innerHTML += `<div class="msg bot">${response}</div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }, 500);
    }

    // --- CORE NAVIGATION ---
    function openZoom(src) {
        document.getElementById('modal-img').src = src;
        document.getElementById('zoom-modal').style.display = 'flex';
    }

    function loadPhase(num) {
        const phase = curriculum['phase' + num];
        document.getElementById('phase-title').innerText = phase.name;
        const list = document.getElementById('subject-list');
        list.innerHTML = "";
        
        phase.subjects.forEach(sub => {
            const container = document.createElement('div');
            const link = document.createElement('div');
            link.className = "sub-link";
            link.innerHTML = `<span>${sub}</span>` + (sub === 'Anatomy' ? `<i class="fa-solid fa-chevron-down"></i>` : "");
            link.onclick = () => (sub === 'Anatomy') ? toggleAnatomy() : renderSubject(sub);
            container.appendChild(link);
            
            if(sub === 'Anatomy') {
                const subMenu = document.createElement('div');
                subMenu.className = "anatomy-submenu";
                subMenu.id = "anatomy-list";
                const topics = ["Osteology", "Muscles", "TMJ", "Nerves", "Clinical Correlations"];
                topics.forEach(t => {
                    const tLink = document.createElement('div');
                    tLink.className = "topic-link";
                    tLink.innerText = t;
                    tLink.onclick = (e) => { e.stopPropagation(); renderAnatomyTopic(t); };
                    subMenu.appendChild(tLink);
                });
                container.appendChild(subMenu);
            }
            list.appendChild(container);
        });
        document.querySelectorAll('.phase-icon').forEach((icon, i) => icon.classList.toggle('active', (i+1) === num));
        renderSubject(phase.subjects[0]);
    }

    function toggleAnatomy() {
        document.getElementById('anatomy-list').classList.toggle('active');
        renderAnatomyTopic("Osteology");
    }

    function renderAnatomyTopic(topic) {
        const target = document.getElementById('render-target');
        if (topic === "Osteology") {
            target.innerHTML = `<h1>Osteology</h1><div class="nested-tab-nav"><button class="tab-btn active-tab" onclick="switchNested(this,'osteo','overview')">Overview</button><button class="tab-btn" onclick="switchNested(this,'osteo','mandible')">Mandible</button><button class="tab-btn" onclick="switchNested(this,'osteo','examprep')">Prep</button></div><div id="nested-content">${osteoTabs.overview}</div>`;
        } else if (topic === "Muscles") {
            target.innerHTML = `<h1>Muscles</h1><div class="nested-tab-nav"><button class="tab-btn active-tab" onclick="switchNested(this,'muscle','general')">General</button><button class="tab-btn" onclick="switchNested(this,'muscle','mastication')">Mastication</button><button class="tab-btn" onclick="switchNested(this,'muscle','expression')">Expression</button></div><div id="nested-content">${muscleTabs.general}</div>`;
        } else if (topic === "TMJ") {
            target.innerHTML = `<h1>TMJ</h1><div id="nested-content">${tmjTabs.overview}</div>`;
        } else {
            target.innerHTML = `<h1>${topic}</h1><p>Content for ${topic} is loading.</p>`;
        }
    }

    function switchNested(btn, type, id) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
        btn.classList.add('active-tab');
        document.getElementById('nested-content').innerHTML = (type==='osteo') ? osteoTabs[id] : muscleTabs[id];
    }

    function renderSubject(sub) {
        document.getElementById('render-target').innerHTML = `<h1>${sub}</h1><p>Module content for ${sub} is loading.</p>`;
    }

    window.onload = () => loadPhase(1);
</script>
</body>
</html>
