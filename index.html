<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Clinical Anatomy & Dev Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --success: #10b981; --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        .dashboard { display: grid; grid-template-columns: 280px 1fr 380px; height: 100vh; }

        /* Sidebar Navigation */
        aside.nav-sidebar { background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); margin-bottom: 20px; padding: 10px; border-bottom: 2px solid var(--brand-light); }
        .phase-label { font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px; padding-left: 10px; }
        .nav-link { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; color: var(--text-light); transition: 0.2s; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .nav-link:hover, .nav-link.active { background: var(--brand-light); color: var(--brand); font-weight: 700; }

        /* Main Viewer */
        main.viewer { padding: 30px; overflow-y: auto; background: var(--bg); }
        .content-wrap { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 35px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid #f1f5f9; }

        /* Content Components */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .info-box { background: #f8fafc; padding: 20px; border-radius: 15px; border-left: 4px solid var(--brand); }
        .high-yield-badge { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; margin-bottom: 10px; display: inline-block; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        table th, table td { padding: 10px; border: 1px solid #e2e8f0; text-align: left; }
        table th { background: #f1f5f9; }

        /* AI Sidebar */
        .ai-sidebar { background: white; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
        .ai-header { padding: 15px 20px; background: var(--brand); color: white; font-weight: 800; font-size: 0.9rem; }
        iframe { width: 100%; height: 100%; border: none; flex: 1; }
        textarea#notes { height: 180px; border: none; border-top: 1px solid #eee; padding: 15px; font-size: 0.85rem; background: #fffdf5; outline: none; }
    </style>
</head>
<body>

<div class="dashboard">
    <aside class="nav-sidebar">
        <div class="logo">DentoGuide</div>
        
        <div class="phase-label">Foundations</div>
        <!-- To add a new tab, copy the line below and change the name inside render('') -->
        <div class="nav-link active" onclick="render('Anatomy')">Anatomy (H&N)</div>
        <div class="nav-link" onclick="render('Physiology')">Physiology</div>
        
        <div class="phase-label">Clinical</div>
        <div class="nav-link" onclick="render('Operative')">Operative</div>

        <!-- NEW TAB EXAMPLE -->
        <div class="phase-label">Administration</div>
        <div class="nav-link" onclick="render('DevGuide')"><i class="fa-solid fa-code"></i> How to Add Pages</div>
    </aside>

    <main class="viewer">
        <div class="content-wrap" id="main-view"></div>
    </main>

    <aside class="ai-sidebar">
        <div class="ai-header">DentoAI Assistant</div>
        <iframe src="https://www.chatbase.co/chatbot-iframe/your_id"></iframe>
        <textarea id="notes" placeholder="Notes for this module..."></textarea>
    </aside>
</div>

<script>
    let currentMod = "Anatomy";

    const database = {
        Anatomy: {
            title: "Head & Neck: Dental High-Yield",
            body: `
                <div class="info-grid">
                    <div class="info-box">
                        <span class="high-yield-badge">OSTEOLOGY</span>
                        <h4>The Mandible</h4>
                        <ul>
                            <li><b>Mandibular Foramen:</b> Entry for IAN (target for blocks).</li>
                            <li><b>Mental Foramen:</b> Located near 2nd premolar apex.</li>
                            <li><b>Lingula:</b> Bony attachment for sphenomandibular ligament.</li>
                        </ul>
                    </div>
                    <div class="info-box">
                        <span class="high-yield-badge">SPACES</span>
                        <h4>Infratemporal Fossa</h4>
                        <p>Contains: Muscles of mastication, Maxillary Artery, and Mandibular Nerve (V3).</p>
                    </div>
                </div>

                <h3>Neurovasculature Summary</h3>
                <table>
                    <tr><th>Structure</th><th>Dental Significance</th></tr>
                    <tr><td><b>Inferior Alveolar Nerve</b></td><td>Sensory to all lower teeth in one quadrant.</td></tr>
                    <tr><td><b>Lingual Nerve</b></td><td>Sensory to anterior 2/3 of tongue.</td></tr>
                    <tr><td><b>Maxillary Artery</b></td><td>Supplies upper/lower teeth via alveolar branches.</td></tr>
                </table>
            `
        },
        DevGuide: {
            title: "Developer Guide: Adding Content",
            body: `
                <h3>How to add a new Tab/Page</h3>
                <p>Follow these 2 steps to expand your website:</p>
                <br>
                <div class="info-box">
                    <h4>Step 1: The Sidebar Link</h4>
                    <code>&lt;div class="nav-link" onclick="render('NewPageName')"&gt;New Page&lt;/div&gt;</code>
                </div>
                <br>
                <div class="info-box">
                    <h4>Step 2: The Data Entry</h4>
                    <p>Go to the JavaScript section in the code and add a new entry to the <b>database</b> object:</p>
                    <pre>
                    NewPageName: {
                        title: "My New Page Title",
                        body: "&lt;h3&gt;Welcome&lt;/h3&gt;&lt;p&gt;Your text here.&lt;/p&gt;"
                    }
                    </pre>
                </div>
            `
        }
    };

    function render(mod) {
        currentMod = mod;
        const data = database[mod] || { title: mod, body: "Content coming soon..." };
        document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.innerText.includes(mod)));
        document.getElementById('main-view').innerHTML = `
            <div class="card">
                <h1>${data.title}</h1>
                <hr style="opacity:0.1; margin: 20px 0;">
                ${data.body}
            </div>
        `;
    }

    window.onload = () => render('Anatomy');
</script>
</body>
</html>
