<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Head & Neck Anatomy Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        .dashboard { display: grid; grid-template-columns: 280px 1fr 380px; height: 100vh; }

        /* Navigation Sidebar */
        aside.nav-sidebar { background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); margin-bottom: 20px; padding: 10px; border-bottom: 2px solid var(--brand-light); }
        .phase-label { font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px; padding-left: 10px; }
        .nav-link { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; color: var(--text-light); transition: 0.2s; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .nav-link:hover, .nav-link.active { background: var(--brand-light); color: var(--brand); font-weight: 700; }

        /* Main Viewer */
        main.viewer { padding: 30px; overflow-y: auto; background: var(--bg); }
        .content-wrap { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 35px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid #f1f5f9; }

        /* Kenhub Style Content Grid */
        .anatomy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .anatomy-box { background: #f8fafc; padding: 20px; border-radius: 15px; border-top: 4px solid var(--brand); }
        .anatomy-box h4 { font-size: 0.9rem; color: var(--brand); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        /* Clinical/High Yield Styling */
        .clinical-alert { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 15px; margin: 20px 0; font-size: 0.9rem; color: #92400e; }
        .mnemonic-tag { background: var(--brand); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; display: inline-block; }

        /* Tables & Lists */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        table th, table td { padding: 10px; border: 1px solid #e2e8f0; text-align: left; }
        table th { background: #f1f5f9; }
        ul.check-list { list-style: none; }
        ul.check-list li::before { content: '→'; color: var(--brand); font-weight: bold; margin-right: 8px; }

        /* AI Sidebar */
        .ai-sidebar { background: white; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
        .ai-header { padding: 15px 20px; background: var(--brand); color: white; font-weight: 800; font-size: 0.9rem; }
        iframe { width: 100%; height: 100%; border: none; flex: 1; }
        textarea#notes { height: 180px; border: none; border-top: 1px solid #eee; padding: 15px; font-size: 0.85rem; background: #fffdf5; outline: none; }
    </style>
</head>
<body>

<div class="dashboard">
    <aside class="nav-sidebar">
        <div class="logo"><i class="fa-solid fa-tooth"></i> DentoGuide</div>
        
        <div class="phase-label">Phase 1: Foundations</div>
        <div class="nav-link active" onclick="render('Anatomy')">Anatomy (H&N)</div>
        <div class="nav-link" onclick="render('Physiology')">Physiology</div>
        <div class="nav-link" onclick="render('Micro')">Microbiology</div>

        <div class="phase-label">Phase 2: Dental Sciences</div>
        <div class="nav-link" onclick="render('Materials')">Dental Materials</div>
        <div class="nav-link" onclick="render('Morphology')">Tooth Morphology</div>

        <div class="phase-label">Phase 3: Clinical</div>
        <div class="nav-link" onclick="render('Operative')">Operative</div>
        <div class="nav-link" onclick="render('Surgery')">Oral Surgery</div>

        <div class="phase-label">Mastery</div>
        <div class="nav-link" onclick="render('Recall')"><i class="fa-solid fa-brain"></i> Mastery Lab</div>
    </aside>

    <main class="viewer">
        <div class="content-wrap" id="main-view">
            <!-- Anatomy Content Injected Here -->
        </div>
    </main>

    <aside class="ai-sidebar">
        <div class="ai-header"><i class="fa-solid fa-robot"></i> DentoAI Assistant</div>
        <iframe src="https://www.chatbase.co/chatbot-iframe/v_your_id"></iframe>
        <div style="padding:10px; font-weight:800; font-size:0.65rem; color:#94a3b8; letter-spacing:1px;">MODULE NOTES</div>
        <textarea id="notes" placeholder="Type your own anatomy notes here..."></textarea>
    </aside>
</div>

<script>
    let currentMod = "Anatomy";

    const database = {
        Anatomy: {
            title: "Head & Neck Anatomy Mastery",
            badge: "CORE FOUNDATION",
            body: `
                <p class="text-light">Based on high-yield clinical standards for dental surgery and diagnosis.</p>
                
                <div class="anatomy-grid">
                    <div class="anatomy-box">
                        <h4><i class="fa-solid fa-skull"></i> 1. Osteology (Bones)</h4>
                        <ul class="check-list">
                            <li><b>Neurocranium (8):</b> Protects the brain.</li>
                            <li><b>Viscerocranium (14):</b> Includes Maxilla, Mandible, and Zygomatic.</li>
                            <li><b>TMJ:</b> The only mobile joint of the skull.</li>
                        </ul>
                    </div>
                    <div class="anatomy-box">
                        <h4><i class="fa-solid fa-bolt"></i> 2. Muscles of Mastication</h4>
                        <ul class="check-list">
                            <li><b>Temporalis:</b> Elevates/Retracts mandible.</li>
                            <li><b>Masseter:</b> Powerful elevation (biting).</li>
                            <li><b>Pterygoids:</b> Medial (elevation), Lateral (protrusion/grinding).</li>
                        </ul>
                    </div>
                </div>

                <div class="clinical-alert">
                    <span class="mnemonic-tag">Clinical Tip</span>
                    <p>All muscles of mastication are innervated by the <b>Mandibular Nerve (V3)</b>, the 3rd branch of the Trigeminal Nerve.</p>
                </div>

                <div class="anatomy-box" style="width:100%;">
                    <h4><i class="fa-solid fa-network-wired"></i> 3. Neurovasculature (High Yield)</h4>
                    <table>
                        <tr><th>Nerve/Vessel</th><th>Clinical Relevance</th></tr>
                        <tr><td><b>Trigeminal (CN V)</b></td><td>Sensory to all teeth; Target for LA blocks.</td></tr>
                        <tr><td><b>Facial (CN VII)</b></td><td>Muscles of expression; Chorda tympani (taste).</td></tr>
                        <tr><td><b>Maxillary Artery</b></td><td>Primary blood supply to upper/lower teeth.</td></tr>
                    </table>
                </div>

                <div class="framework-box" style="margin-top:25px; padding:20px; border:1px solid #e2e8f0; border-radius:15px;">
                    <span class="mnemonic-tag">Mnemonic: Foramina Exits</span>
                    <p style="font-weight:700; color:var(--brand);">"Standing Room Only"</p>
                    <p><b>S</b>uperior Orbital Fissure (V1) | <b>R</b>otundum (V2) | <b>O</b>vale (V3)</p>
                </div>
            `
        },
        Operative: {
            title: "Operative Dentistry",
            badge: "CLINICAL PHASE",
            body: `
                <div class="anatomy-box">
                    <h4>The Clinical Framework</h4>
                    <p><b>Definition:</b> Restoration of form and function.</p>
                    <p><b>Indications:</b> Caries, Fracture, or Aesthetics.</p>
                    <p><b>Steps:</b> 1. Access 2. Prep 3. Isolate 4. Fill.</p>
                    <p><b>Viva:</b> What is the purpose of a 90-degree cavosurface angle?</p>
                </div>
            `
        }
    };

    function render(mod) {
        currentMod = mod;
        const data = database[mod] || { title: mod, badge: "CURRICULUM", body: "Content loading..." };
        
        document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.innerText.includes(mod)));

        document.getElementById('main-view').innerHTML = `
            <div class="card">
                <span style="font-size:0.7rem; font-weight:800; color:var(--brand);">${data.badge}</span>
                <h1 style="margin:10px 0 20px;">${data.title}</h1>
                <hr style="opacity:0.1; margin-bottom:20px;">
                ${data.body}
            </div>
        `;
        document.getElementById('notes').value = localStorage.getItem(`note_${mod}`) || "";
    }

    document.getElementById('notes').addEventListener('input', (e) => {
        localStorage.setItem(`note_${currentMod}`, e.target.value);
    });

    window.onload = () => render('Anatomy');
</script>

</body>
</html>
