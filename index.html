<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DentoGuide | Clinical Mastery Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --border: #e2e8f0; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* --- LAYOUT --- */
        .app-container { display: grid; grid-template-columns: 80px 280px 1fr 340px; height: 100vh; transition: 0.3s; }

        .mobile-header {
            display: none; background: var(--white); padding: 10px 15px; border-bottom: 1px solid var(--border);
            justify-content: space-between; align-items: center; position: fixed; top: 0; width: 100%; z-index: 2000;
        }
        .m-btn { background: var(--brand-light); border: none; color: var(--brand); padding: 8px 12px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; display: flex; align-items: center; gap: 5px; cursor: pointer; }

        .phase-rail { background: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .phase-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; font-size: 1.2rem; position: relative; }
        .phase-icon.active { background: var(--brand); box-shadow: 0 0 20px var(--brand); }
        .phase-icon span { position: absolute; left: 65px; background: var(--text); color: white; padding: 5px 12px; border-radius: 6px; font-size: 0.7rem; white-space: nowrap; opacity: 0; pointer-events: none; }

        .sidebar { background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; z-index: 1500; }
        .sidebar-title { font-size: 0.6rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .sub-link { padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--text-light); margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .sub-link.active { background: var(--brand-light); color: var(--brand); }

        .nested-submenu { margin-top: 5px; padding-left: 10px; border-left: 2px solid var(--border); display: none; }
        .nested-submenu.active { display: block; }
        .topic-link { padding: 10px; font-size: 0.75rem; font-weight: 700; color: var(--text-light); cursor: pointer; border-radius: 6px; display: block; margin-bottom: 2px; }
        .topic-link:hover, .topic-link.active-topic { color: var(--brand); background: var(--brand-light); }

        main.viewer { padding: 40px; overflow-y: auto; display: flex; justify-content: center; width: 100%; }
        .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); width: 100%; max-width: 900px; border: 1px solid var(--border); height: fit-content; min-height: 80%; }

        .utility { background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1600; }
        .ai-header { padding: 15px; font-weight: 800; font-size: 0.75rem; border-bottom: 1px solid #eee; color: var(--brand); display: flex; align-items: center; gap: 8px; background: #fff; }
        #ai-chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #f8fafc; font-size: 0.75rem; }
        .msg { padding: 10px; border-radius: 10px; max-width: 85%; line-height: 1.4; }
        .msg.bot { background: white; border: 1px solid var(--border); align-self: flex-start; }
        .msg.user { background: var(--brand); color: white; align-self: flex-end; }
        #notes { height: 180px; border: none; border-top: 1px solid #eee; padding: 15px; font-size: 0.85rem; background: #fffdf5; outline: none; resize: none; }

        /* UI Helpers */
        .image-container { position: relative; width: 100%; margin: 15px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); cursor: zoom-in; background: #fff; }
        .image-container img { width: 100%; display: block; }
        .clinical-box { background: #f8fafc; padding: 15px; border-radius: 12px; border-left: 4px solid var(--brand); margin: 10px 0; font-size: 0.85rem; }
        .clinical-box b { color: var(--brand); display: block; margin-bottom: 5px; text-transform: uppercase; font-size: 0.75rem; }
        .mnemonic-box { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 10px; margin: 10px 0; color: #92400e; font-size: 0.8rem; font-weight: 600; }
        
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; margin-right: 5px; text-transform: uppercase; }
        .t-red { background: #fee2e2; color: #ef4444; }
        .t-blue { background: #eff6ff; color: #2563eb; }
        .t-green { background: #dcfce7; color: #16a34a; }

        table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 0.85rem; }
        th { background: #f1f5f9; text-align: left; padding: 12px; border: 1px solid var(--border); text-transform: uppercase; font-size: 0.7rem; }
        td { padding: 12px; border: 1px solid var(--border); }

        #zoom-modal { display: none; position: fixed; z-index: 10000; inset: 0; background: rgba(15, 23, 42, 0.95); align-items: center; justify-content: center; }
        #modal-img { max-width: 95%; max-height: 85%; border-radius: 10px; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1400; }

        /* --- MOBILE MEDIA QUERIES --- */
        @media (max-width: 1024px) { .app-container { grid-template-columns: 80px 240px 1fr; } .utility { display: none; } }
        @media (max-width: 768px) {
            .app-container { grid-template-columns: 1fr; display: block; padding-top: 60px; padding-bottom: 80px; }
            .mobile-header { display: flex; }
            .phase-rail { flex-direction: row; width: 100%; height: 70px; position: fixed; bottom: 0; padding: 0; justify-content: space-around; border-top: 1px solid #334155; }
            .sidebar { position: fixed; left: -100%; top: 60px; bottom: 70px; width: 85%; transition: 0.3s; background: #fff; }
            .sidebar.active { left: 0; }
            .utility { display: flex !important; position: fixed; right: -100%; top: 60px; bottom: 70px; width: 90%; transition: 0.3s; box-shadow: -10px 0 30px rgba(0,0,0,0.2); }
            .utility.active { right: 0; }
            main.viewer { padding: 15px; width: 100%; }
            .overlay.active { display: block; }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="mobile-header">
    <button class="m-btn" onclick="toggleMenu('sidebar')"><i class="fa-solid fa-list-ul"></i> TOPICS</button>
    <b style="letter-spacing: -1px;">DentoGuide</b>
    <button class="m-btn" onclick="toggleMenu('utility')"><i class="fa-solid fa-message-dots"></i> AI & NOTES</button>
</div>

<div id="zoom-modal" onclick="this.style.display='none'">
    <img id="modal-img" src="">
</div>

<div class="app-container">
    <nav class="phase-rail">
        <div class="phase-icon active" onclick="loadPhase(1)"><i class="fa-solid fa-brain"></i></div>
        <div class="phase-icon" onclick="loadPhase(2)"><i class="fa-solid fa-tooth"></i></div>
        <div class="phase-icon" onclick="loadPhase(3)"><i class="fa-solid fa-toolbox"></i></div>
        <div class="phase-icon" onclick="loadPhase(4)"><i class="fa-solid fa-rotate"></i></div>
        <div class="phase-icon" onclick="loadPhase(5)"><i class="fa-solid fa-vial"></i></div>
    </nav>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title" id="phase-title">Phase 1</div>
        <div id="subject-list"></div>
    </aside>

    <main class="viewer">
        <div id="render-target" class="card"></div>
    </main>

    <aside class="utility" id="utility">
        <div class="ai-header"><i class="fa-solid fa-robot"></i> DentoAI ASSISTANT</div>
        <div id="ai-chat-window">
            <div class="msg bot">Hello! I'm DentoAI. I've updated my knowledge with your RPD Master Guide! Ask me about Kennedy Classes or surveying!</div>
        </div>
        <div style="padding:10px; background:white; display:flex; gap:5px; border-top:1px solid #eee;">
            <input type="text" id="ai-input" placeholder="Type a question..." style="flex:1; padding:10px; border-radius:8px; border:1px solid #ddd; outline:none; font-size:0.75rem;" onkeypress="if(event.key==='Enter') askDentoAI()">
            <button onclick="askDentoAI()" style="background:var(--brand); color:white; border:none; width:40px; border-radius:8px;"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
        <textarea id="notes" placeholder="Persistent notes auto-save..."></textarea>
    </aside>
</div>

<script>
    const anatomyContent = {
        "Osteology": `<h3>🦴 OSTEOLOGY: SKULL & MANDIBLE (MASTER PACK)</h3>
            
            <div class="image-container" onclick="openZoom('https://cdn.britannica.com/71/74271-050-E3E9773D/Lateral-views-human-skull.jpg')">
                <img src="https://cdn.britannica.com/71/74271-050-E3E9773D/Lateral-views-human-skull.jpg">
            </div>

            <div class="clinical-box">
                <b>🧠 1. Skull & Bony Landmarks Overview</b>
                <ul>
                    <li><b>Maxilla:</b> Forms upper jaw, supports teeth, contains Maxillary Sinus.</li>
                    <li><b>Mandible:</b> Strongest facial bone, movable, forms TMJ.</li>

            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;">
                <div style="background:var(--brand); color:white; padding:15px; border-radius:12px; text-align:center;"><h1>22</h1>Total Bones</div>
                <div style="background:var(--brand); color:white; padding:15px; border-radius:12px; text-align:center;"><h1>8</h1>Cranial</div>
                <div style="background:var(--brand); color:white; padding:15px; border-radius:12px; text-align:center;"><h1>14</h1>Facial</div>

            <h4>🔢 Cranial Bones (8)</h4>
            <p>Frontal (1), Parietal (2), Temporal (2), Occipital (1), Sphenoid (1), Ethmoid (1)</p>
            <div class="mnemonic-box">👉 Mnemonic: “PEST OF 6” (Parietal, Ethmoid, Sphenoid, Temporal, Occipital, Frontal)</div>

            <h4>🔢 Facial Bones (14)</h4>
            <p>Maxilla (2), Zygomatic (2), Nasal (2), Lacrimal (2), Palatine (2), Inferior nasal concha (2), Vomer (1), Mandible (1)</p>
            <div class="mnemonic-box">👉 Mnemonic: “Virgil Can Not Make My Pet Zebra Laugh”</div>

            <hr style="opacity:0.1; margin:30px 0;">

            <h3>🦷 2. THE MANDIBLE (THE STAR OF DENTISTRY)</h3>
            <div class="image-container" onclick="openZoom('https://cdn.britannica.com/96/99196-050-ED0AA964/mandible.jpg')">
                <img src="https://cdn.britannica.com/96/99196-050-ED0AA964/mandible.jpg">
            </div>
            
            <div class="clinical-box">
                <b>Parts of Mandible:</b> Body, Ramus, Angle, Alveolar Process.
            </div>
<div class="FACTS">
                <b>FACTS</b> Strongest facial bone Ramus, Only movable bone of skull, Forms TMJ with temporal bone
            </div>

            <h4>📍 Important Landmarks (EXAM GOLD)</h4>
            <div class="clinical-box"><span class="tag t-red">🔴 Mandibular Foramen</span> Medial ramus. Entry of <b>Inferior Alveolar Nerve (IAN)</b>. Target for IAN Block.</div>
            <div class="clinical-box"><span class="tag t-blue">🔵 Mental Foramen</span> Near premolars. Exit of mental nerve. Mnemonic: "Mental = Mouth Exit".</div>
            <div class="clinical-box"><span class="tag t-yellow">🟡 Lingula</span> Tongue-shaped projection. Landmark for anesthesia.</div>
            <div class="clinical-box"><span class="tag t-green">🟢 Mylohyoid Line</span> Muscle attachment landmark.</div>

            <hr style="opacity:0.1; margin:30px 0;">

            <h3>🧠 3. MAXILLA (CLINICAL IMPORTANCE)</h3>
            <div class="clinical-box">
                <ul>
                    <li>👉 Clinical: Forms upper jaw </li>
		    <li>👉 Clinical: Contains maxillary sinus </li>
		    <li>👉 Clinical: Sinus infections → can mimic tooth pain.</li>
                    <li>👉 Clinical: Extractions → risk of sinus perforation.</li>
                </ul>
            </div>

            <h3>🧬 4. DEVELOPMENT & OSSIFICATION</h3>
            <div class="clinical-box">
                <b>Mandible:</b> 1st pharyngeal arch. Intramembranous ossification. Guided by <b>Meckel’s Cartilage</b> (Johann Friedrich Meckel).
            </div>
		 <b>Maxilla:</b> 1st pharyngeal arch.</div>

            <h4>🧠 OSSIFICATION TYPES</h4>
            <table>
                <tr><th>Type</th><th>Example</th><th>Mnemonic</th></tr>
                <tr><td>Intramembranous</td><td>Mandible, Maxilla</td><td>Face = Membrane</td></tr>
                <tr><td>Endochondral</td><td>Base of skull</td><td>Base = Cartilage</td></tr>
            </table>

            <h3>⚡ 6. IMPORTANT FORAMINA</h3>
            <table>
                <tr><th>Foramen</th><th>Structure</th><th>Clinical</th></tr>
                <tr><td>Mandibular</td><td>IAN</td><td>Nerve block</td></tr>
                <tr><td>Mental</td><td>Mental nerve</td><td>Lower lip numbness</td></tr>
                <tr><td>Infraorbital</td><td>Infraorbital nerve</td><td>Midface anesthesia</td></tr>
                <tr><td>Ovale</td><td>CN V3</td><td>Mastication</td></tr>
            </table>

            <h3>🧠 7. MUSCLE ATTACHMENTS</h3>
            <table>
                <tr><th>Muscle</th><th>Attachment Point</th></tr>
                <tr><td>Masseter</td><td>Angle of mandible</td></tr>
                <tr><td>Temporalis</td><td>Coronoid process</td></tr>
                <tr><td>Medial Pterygoid</td><td>Inner angle</td></tr>
                <tr><td>Lateral Pterygoid</td><td>Condyle</td></tr>

            <h3>🔥 8. CLINICAL CORRELATIONS</h3>
            <div class="mnemonic-box" style="background:#fee2e2; border-color:var(--danger)">
                <b>❗ Fracture Sites: “CAP” breaks easily</b><br>
                Condyle, Angle, Parasymphysis.
            </div>
            <p><b>IAN Damage:</b> Results in lower lip numbness. <b>Dry Socket:</b> Risk related to bone healing.<b>TMJ RELATION:</b> Mandibular condyle articulates with temporal bone</p>

            <h3>📚 9. IMPORTANT AUTHORS</h3>
            <ul>
                <li><b>Andreas Vesalius:</b> Father of modern anatomy.</li>

            </ul>

            <div class="mnemonic-box" style="background:var(--text); color:white; border:none;">
                <h4 style="color:var(--success)">🎯 ULTRA-HIGH YIELD SUMMARY</h4>
                <ul>
		    <li>Skullbones = 22</li>
		    <li>Cranial = 8</li>
                    <li>Facial = 14</li>
                    <li>Teeth (adult) = 32</li>
                    <li>Mandible = 1 bone</li>
                    <li>Mandible = movable + strongest</li>
                    <li>Mandibular foramen = IAN</li>
                    <li>Mental foramen = lip sensation</li>
                    <li>CN V3 = mastication</li>
                    <li>Maxilla = sinus risk</li>
                    <li>Ludwig’s angina = airway emergency</li>
                </ul>
        `,
        "Muscles": `<h3>💪 MUSCLES OF HEAD & NECK (MASTER PACK)</h3>
            
            <div class="clinical-box">
                <b>🧠 1. DEFINITION (EXAM READY)</b>
                <p>Responsible for: Mastication, Facial expression, Swallowing, Speech, and Head movement.</p>

            <h3>🔥 2. MUSCLES OF MASTICATION (ULTRA HIGH-YIELD)</h3>

            <div class="mnemonic-box">👉 Mnemonic: “M&M Tastes Like Pizza” (Masseter, Medial pterygoid, Temporalis, Lateral pterygoid)</div>

            <table>
                <tr><th>Muscle</th><th>Action</th><th>Attachment</th><th>Nerve</th></tr>
                <tr><td><b>Masseter</b></td><td>Elevation</td><td>Angle of mandible</td><td>V3</td></tr>
                <tr><td><b>Temporalis</b></td><td>Elev + Retraction</td><td>Coronoid process</td><td>V3</td></tr>
                <tr><td><b>Medial Pterygoid</b></td><td>Elevation</td><td>Inner mandible</td><td>V3</td></tr>
                <tr><td><b>Lateral Pterygoid</b></td><td>Opening + Protrusion</td><td>Condyle</td><td>V3</td></tr>
            </table>

            <div class="mnemonic-box" style="border-color:var(--danger); color:var(--danger)">
                <b>🚨 MUST-KNOW:</b> ONLY muscle that <b>OPENS</b> mouth: <b>Lateral Pterygoid</b> ("Lateral = Lowers jaw").
            </div>

            <div class="clinical-box">
                <b>⚠️ CLINICAL CORRELATION:</b>
                <ul>
                    <li><b>Trismus (lockjaw):</b> Pterygoid involvement.</li>
                    <li><b>Bruxism:</b> Masseter hypertrophy.</li>
                    <li><b>TMJ disorder:</b> Lateral pterygoid dysfunction.</li>
                </ul>
            </div>

            <hr style="opacity:0.1; margin:30px 0;">

            <h3>🎭 3. MUSCLES OF FACIAL EXPRESSION</h3>
            <div class="clinical-box">
                <b>Key Fact:</b> These insert into <b>SKIN</b> (Not bone). ALL supplied by <b>Facial Nerve (VII)</b>.
            </div>
            <ul>

            <div class="mnemonic-box">👉 Mnemonic: “OBOZ-FB”</div>

            <div class="clinical-box" style="border-color:var(--danger)">

            </div>

            <div class="clinical-box" style="border-color:var(--success)">
                <b>🦷 4. BUCCINATOR (DENTISTRY FAVORITE)</b><br>

            <hr style="opacity:0.1; margin:30px 0;">

        "TMJ": `<h3>🧠 TMJ MASTER GUIDE</h3><div class="image-container" onclick="openZoom('https://my.clevelandclinic.org/-/scassets/Images/org/health/articles/15066-tmj-disorder')"><img src="https://my.clevelandclinic.org/-/scassets/Images/org/health/articles/15066-tmj-disorder"></div>`,
        "Cranial Nerves": `<h3>⚡ CRANIAL NERVES</h3><div class="image-container" onclick="openZoom('https://static.wixstatic.com/media/527197_e3bb11cf986f47f0bde4e541998a37d8~mv2.png/v1/fill/w_980,h_541,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/527197_e3bb11cf986f47f0bde4e541998a37d8~mv2.png')"><img src="https://static.wixstatic.com/media/527197_e3bb11cf986f47f0bde4e541998a37d8~mv2.png"></div>`,

    function askDentoAI() {
        const input = document.getElementById('ai-input');
        const chat = document.getElementById('ai-chat-window');
        const query = input.value.toLowerCase();
        if(!query) return;
        chat.innerHTML += `<div class="msg user">${input.value}</div>`;
        input.value = "";
        setTimeout(() => {
            let res = "Check your master guides for details! I know about RPD classes, TMJ, and Skull bones.";
            for(let i of aiKnowledge) { if(i.keys.some(k => query.includes(k))) { res = i.ans; break; } }
            chat.innerHTML += `<div class="msg bot">${res}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }, 400);
    }

    function toggleMenu(type) { document.getElementById(type).classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function closeAll() { document.getElementById('sidebar').classList.remove('active'); document.getElementById('utility').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); }
    function openZoom(src) { document.getElementById('modal-img').src = src; document.getElementById('zoom-modal').style.display = 'flex'; }

    const curriculum = {
        phase1: { name: "Foundations", subjects: ["Anatomy", "Physiology", "Biochemistry", "Histology", "Microbiology", "Pathology"] },
        phase2: { name: "Dental Sciences", subjects: ["Dental Anatomy", "Oral Histology", "Oral Pathology", "Dental Materials", "Pharmacology"] },
        phase3: { name: "Clinical Subjects", subjects: ["Operative Dentistry", "Prosthodontics", "Endodontics", "Oral Surgery", "Orthodontics", "Pediatrics"] },
        phase4: { name: "Frameworks", subjects: ["Chief complaint", "History", "Examination", "Diagnosis", "Treatment plan"] },
        phase5: { name: "Active Recall", subjects: ["MCQs", "Flashcards", "Blurting", "Quizzes"] }
    };

    function loadPhase(num) {
        const phase = curriculum['phase' + num];
        document.getElementById('phase-title').innerText = phase.name;
        const list = document.getElementById('subject-list');
        list.innerHTML = "";
        phase.subjects.forEach(sub => {
            const container = document.createElement('div');
            const link = document.createElement('div');
            link.className = "sub-link";
            link.innerHTML = `<span>${sub}</span>` + (['Anatomy', 'Prosthodontics'].includes(sub) ? `<i class="fa-solid fa-chevron-down"></i>` : "");
            link.onclick = () => { if(['Anatomy', 'Prosthodontics'].includes(sub)) toggleNested(sub); else { renderSubject(sub); if(window.innerWidth < 768) closeAll(); } };
            container.appendChild(link);
            const subMenu = document.createElement('div');
            subMenu.className = "nested-submenu";
            subMenu.id = `sub-${sub.toLowerCase().replace(/\s/g, '')}`;
            let topics = [];
            if(sub === 'Anatomy') topics = ["Osteology", "Muscles", "TMJ", "Cranial Nerves", "Blood Supply", "Venous Drainage", "Lymphatics", "Salivary Glands", "Fascial Spaces", "Oral Cavity", "Tongue", "Pharynx", "Clinical Correlations"];
            if(sub === 'Prosthodontics') topics = ["Complete Dentures", "RPD", "Fixed Prostho", "Implants", "Occlusion", "Materials", "Complications", "Case-Based Learning"];
            topics.forEach(t => {
                const tLink = document.createElement('div'); tLink.className = "topic-link"; tLink.innerText = t;
                tLink.onclick = (e) => { e.stopPropagation(); renderNested(sub, t); if(window.innerWidth < 768) closeAll(); };
                subMenu.appendChild(tLink);
            });
            container.appendChild(subMenu);
            list.appendChild(container);
        });
        document.querySelectorAll('.phase-icon').forEach((icon, i) => icon.classList.toggle('active', (i+1) === num));
        renderSubject(phase.subjects[0]);
    }

    function toggleNested(sub) { document.getElementById(`sub-${sub.toLowerCase().replace(/\s/g, '')}`).classList.toggle('active'); }

    function renderNested(type, topic) {
        const target = document.getElementById('render-target');
        const content = (type === 'Anatomy') ? anatomyContent[topic] : prosthoContent[topic];
        target.innerHTML = content || `<h3>${topic}</h3><p>Clinical guide is loading...</p>`;
        document.getElementById('notes').value = localStorage.getItem(`note_${topic}`) || "";
    }

    function renderSubject(sub) {
        document.getElementById('render-target').innerHTML = `<h1>${sub}</h1><p>Mastery module is ready.</p>`;
        document.getElementById('notes').value = localStorage.getItem(`note_${sub}`) || "";
    }

    document.getElementById('notes').oninput = (e) => {
        const title = document.querySelector('h1, h3').innerText;
        localStorage.setItem(`note_${title}`, e.target.value);
    };

    window.onload = () => loadPhase(1);
</script>
