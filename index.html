<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Guided Mastery System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --border: #e2e8f0; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* --- LAYOUT --- */
        .app-container { display: grid; grid-template-columns: 80px 280px 1fr 340px; height: 100vh; }

        /* Phase Rail */
        .phase-rail { background: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .phase-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; font-size: 1.2rem; }
        .phase-icon.active { background: var(--brand); box-shadow: 0 0 20px var(--brand); }

        /* Sidebar */
        .sidebar { background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sub-link { padding: 12px 15px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 5px; transition: 0.2s; }
        .sub-link:hover, .sub-link.active { background: var(--brand-light); color: var(--brand); }

        /* Content Viewer */
        main.viewer { padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); width: 100%; max-width: 900px; border: 1px solid var(--border); height: fit-content; }

        /* Content Components */
        .clinical-box { background: #f8fafc; padding: 20px; border-radius: 15px; border-left: 5px solid var(--brand); margin: 15px 0; }
        .exam-point { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; display: inline-block; margin-bottom: 10px; }
        .study-tip { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 12px; font-size: 0.85rem; margin-top: 20px; }

        /* Quiz UI */
        .quiz-option { width: 100%; text-align: left; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: white; margin-top: 10px; cursor: pointer; transition: 0.2s; }
        .quiz-option.correct { background: #dcfce7; border-color: var(--success); color: #166534; font-weight: 700; }
        .quiz-option.wrong { background: #fee2e2; border-color: var(--danger); color: #991b1b; }
        .rationale { margin-top: 15px; padding: 15px; background: #eff6ff; border-radius: 10px; display: none; font-size: 0.85rem; border-left: 4px solid var(--brand); }

        /* Analytics */
        .stat-card { padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; }
        .weak-badge { color: var(--danger); font-weight: 800; font-size: 0.7rem; }

        /* Utility */
        .utility { background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        #notes { flex: 1; border: none; padding: 20px; background: #fffdf5; outline: none; resize: none; font-size: 0.9rem; }
        
        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 1fr; }
            .phase-rail, .sidebar, .utility { display: none; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="phase-rail">
        <div class="phase-icon active" onclick="loadPhase(1)" title="Pre-Clinical"><i class="fa-solid fa-brain"></i></div>
        <div class="phase-icon" onclick="loadPhase(2)" title="Dental Sciences"><i class="fa-solid fa-tooth"></i></div>
        <div class="phase-icon" onclick="loadPhase(3)" title="Clinical Subjects"><i class="fa-solid fa-toolbox"></i></div>
        <div class="phase-icon" onclick="loadPhase(4)" title="Clinical Thinking"><i class="fa-solid fa-rotate"></i></div>
    </nav>

    <aside class="sidebar">
        <h2 style="font-size:1.2rem; color:var(--brand); margin-bottom:20px;">DentoGuide</h2>
        <div id="subject-list"></div>
        <hr style="margin: 20px 0; opacity: 0.1;">
        <div class="sub-link" onclick="renderAnalytics()"><i class="fa-solid fa-chart-pie"></i> Weakness Tracker</div>
    </aside>

    <main class="viewer">
        <div id="render-target" class="card"></div>
    </main>

    <aside class="utility">
        <div style="padding:15px; font-weight:800; font-size:0.75rem; border-bottom:1px solid #eee;">DentoAI & PERSISTENT NOTES</div>
        <div style="flex:1; background:#f1f5f9;">
            <iframe src="https://www.chatbase.co/chatbot-iframe/v_your_id" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <textarea id="notes" placeholder="Notes auto-save per subject..."></textarea>
    </aside>
</div>

<script>
    // --- PERSISTENCE & ANALYTICS ---
    let performance = JSON.parse(localStorage.getItem("dento_perf")) || {};

    const curriculum = {
        phase1: {
            name: "Pre-Clinical Mastery",
            subjects: {
                "Anatomy": {
                    title: "Head & Neck Anatomy",
                    content: `<h2>🧠 Core Foundation</h2>
                        <div class="clinical-box"><b>Why it matters:</b><p>Essential for anesthesia, surgery, diagnosis, and nerve mapping.</p></div>
                        <div class="clinical-box"><b>1. Skull & Landmarks</b><ul><li>Mandible: Strongest bone, contains IAN foramen.</li><li>Maxilla: Forms upper jaw & orbital floor.</li></ul></div>
                        <div class="clinical-box"><b>2. Muscles of Mastication</b><ul><li>Elevators: Masseter, Temporalis, Medial Pterygoid.</li><li>Opener: Lateral Pterygoid (Protrusion).</li></ul><b>Innervation: CN V3</b></div>`,
                    quiz: [{ q: "Numb lower lip after extraction involves which nerve?", options: ["Lingual", "Inferior Alveolar", "Facial"], a: 1, r: "IAN becomes the mental nerve which supplies the lower lip." }]
                },
                "Physiology": { title: "Physiology", content: `<div class="clinical-box"><b>Focus:</b><ul><li>Homeostasis</li><li>Saliva production (Parasympathetic vs Sympathetic)</li></ul></div>` },
                "Biochemistry": { title: "Biochemistry", content: `<div class="clinical-box"><ul><li>Metabolism</li><li>Acid-base balance (Critical for dental decay)</li></ul></div>` },
                "Histology": { title: "Histology", content: `<div class="clinical-box"><ul><li>Enamel rods</li><li>Dentin tubules</li></ul></div>` },
                "Microbiology": { title: "Microbiology", content: `<div class="clinical-box"><ul><li>Oral bacteria (S. mutans)</li><li>Caries process</li></ul></div>` },
                "Pathology": { title: "Pathology", content: `<div class="clinical-box"><ul><li>Inflammation</li><li>Cysts & Tumors</li></ul></div>` }
            }
        },
        phase2: {
            name: "Dental Sciences",
            subjects: {
                "Dental Anatomy": { title: "Dental Anatomy", content: `<div class="exam-point">HIGH-YIELD</div><p>Know cusp patterns and eruption ages.</p>` },
                "Dental Materials": { title: "Dental Materials", content: `<div class="exam-point">COMPARE IN TABLES</div><p>Amalgam vs Composite; Alginate vs PVS.</p>` },
                "Pharmacology": { title: "Pharmacology", content: `<div class="clinical-box"><ul><li>Local Anesthetics (Lidocaine, Articaine)</li><li>Antibiotics</li></ul></div>` }
            }
        },
        phase3: {
            name: "Clinical Subjects",
            subjects: {
                "Operative": { title: "Operative Dentistry", content: `<div class="clinical-box"><b>Framework:</b><ul><li>Definition</li><li>Indications</li><li>Procedure</li><li>Complications</li></ul></div>` },
                "Oral Surgery": { title: "Oral Surgery", content: `<div class="clinical-box"><ul><li>Extractions</li><li>Impactions</li><li>Nerve management</li></ul></div>` }
            }
        },
        phase4: {
            name: "Clinical Thinking",
            subjects: {
                "Diagnosis": { title: "Clinical Reasoning", content: `<div class="clinical-box"><b>Framework:</b><p>Chief Complaint → History → Examination → Diagnosis → Tx Plan</p></div>` },
                "Case Training": { title: "Case-Based Learning", content: `<div class="clinical-box"><p><b>Case:</b> Patient with sharp pain on cold water.</p><button onclick="this.nextElementSibling.style.display='block'">Reveal Diagnosis</button><p style="display:none; color:var(--brand); font-weight:bold;">Reversible Pulpitis</p></div>` }
            }
        }
    };

    let activePhase = 1;
    let activeSub = "Anatomy";

    function loadPhase(num) {
        activePhase = num;
        const phase = curriculum['phase'+num];
        const list = document.getElementById('subject-list');
        list.innerHTML = `<div style="font-size:0.7rem; font-weight:800; color:var(--text-light); margin-bottom:10px;">${phase.name.toUpperCase()}</div>`;
        
        Object.keys(phase.subjects).forEach(key => {
            const div = document.createElement('div');
            div.className = "sub-link";
            div.innerText = key;
            div.onclick = () => renderSubject(num, key);
            list.appendChild(div);
        });

        document.querySelectorAll('.phase-icon').forEach((icon, i) => icon.classList.toggle('active', (i+1) === num));
        renderSubject(num, Object.keys(phase.subjects)[0]);
    }

    function renderSubject(pNum, sKey) {
        activeSub = sKey;
        const sub = curriculum['phase'+pNum].subjects[sKey];
        const target = document.getElementById('render-target');
        
        target.innerHTML = `<h1>${sub.title}</h1>${sub.content}
            <div class="study-tip"><b>How to Study This Topic:</b><ul><li>Read once for concepts</li><li>Recall without notes (Blurting)</li><li>Take the MCQ below</li></ul></div>`;

        if(sub.quiz) {
            target.innerHTML += `<div id="quiz-area"></div>`;
            renderQuiz(sub.quiz);
        }

        document.getElementById('notes').value = localStorage.getItem(`note_${sKey}`) || "";
        document.querySelectorAll('.sub-link').forEach(l => l.classList.toggle('active', l.innerText === sKey));
    }

    function renderQuiz(quiz) {
        const area = document.getElementById('quiz-area');
        let cur = 0;
        function show() {
            const q = quiz[cur];
            area.innerHTML = `<div class="clinical-box"><h3>${q.q}</h3>
                ${q.options.map((o, i) => `<button class="quiz-option" onclick="checkAnswer(${i}, ${q.a}, '${q.r}')">${o}</button>`).join('')}
                <div id="rationale" class="rationale"></div></div>`;
        }
        window.checkAnswer = (idx, correct, rat) => {
            const isCorrect = idx === correct;
            if(!performance[activeSub]) performance[activeSub] = {correct: 0, total: 0};
            performance[activeSub].total++; if(isCorrect) performance[activeSub].correct++;
            localStorage.setItem("dento_perf", JSON.stringify(performance));

            const btns = document.querySelectorAll('.quiz-option');
            btns.forEach((b, i) => {
                if(i === correct) b.classList.add('correct');
                else if(i === idx) b.classList.add('wrong');
                b.style.pointerEvents = 'none';
            });
            const rBox = document.getElementById('rationale');
            rBox.innerHTML = `<b>Rationale:</b> ${rat}`;
            rBox.style.display = 'block';
        };
        show();
    }

    function renderAnalytics() {
        const target = document.getElementById('render-target');
        let html = `<h1>Weakness Tracker</h1><p>Based on your quiz performance.</p><br>`;
        for(let sub in performance) {
            let rate = (performance[sub].correct / performance[sub].total) * 100;
            html += `<div class="stat-card"><b>${sub}</b>: ${rate.toFixed(1)}% accuracy ${rate < 70 ? '<span class="weak-badge">! ACTION NEEDED</span>' : ''}</div>`;
        }
        target.innerHTML = html;
    }

    document.getElementById('notes').addEventListener('input', (e) => {
        localStorage.setItem(`note_${activeSub}`, e.target.value);
    });

    window.onload = () => loadPhase(1);
</script>
</body>
</html>
