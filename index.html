<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentoGuide | Clinical Mastery Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #2563eb; --brand-light: #eff6ff; --bg: #f8fafc;
            --text: #0f172a; --text-light: #64748b; --white: #ffffff;
            --border: #e2e8f0; --accent: #f59e0b; --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* --- LAYOUT --- */
        .app-container { display: grid; grid-template-columns: 80px 280px 1fr 340px; height: 100vh; }

        /* Phase Rail */
        .phase-rail { background: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .phase-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.3s; font-size: 1.2rem; }
        .phase-icon:hover { background: var(--brand); }
        .phase-icon.active { background: var(--brand); box-shadow: 0 0 20px var(--brand); }

        /* Sidebar */
        .sidebar { background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
        .sidebar-header { margin-bottom: 20px; }
        .search-bar { width: 100%; padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: 0.85rem; outline: none; margin-bottom: 15px; }
        
        .progress-box { background: var(--bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .progress-box h4 { font-size: 0.7rem; text-transform: uppercase; margin-bottom: 8px; color: var(--text-light); }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--brand); transition: 1s ease; }

        .sub-link { padding: 12px 15px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 5px; display: block; transition: 0.2s; }
        .sub-link:hover, .sub-link.active { background: var(--brand-light); color: var(--brand); }

        /* Main Content */
        main.viewer { padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); width: 100%; max-width: 850px; border: 1px solid var(--border); height: fit-content; }
        
        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.5px; }
        h2 { font-size: 1.25rem; margin: 30px 0 15px; color: var(--brand); }

        /* --- INTERACTIVE COMPONENTS --- */
        .clinical-box { background: #f8fafc; padding: 25px; border-radius: 15px; border-left: 5px solid var(--brand); margin: 20px 0; }
        
        /* Quiz Styles */
        .quiz-btn { width: 100%; text-align: left; padding: 15px; border-radius: 10px; border: 1px solid var(--border); background: white; margin-top: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .quiz-btn:hover { background: var(--brand-light); border-color: var(--brand); }
        
        /* Flashcards */
        .flashcard { background: #fffbeb; border: 2px solid #fde68a; border-radius: 20px; padding: 40px; text-align: center; cursor: pointer; min-height: 200px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 700; transition: 0.3s; }
        .flashcard.flipped { background: var(--brand); border-color: var(--brand); color: white; }

        /* Utility Panel */
        .utility { background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .ai-head { padding: 20px; font-weight: 800; font-size: 0.9rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        #notes { flex: 1; border: none; padding: 20px; font-size: 0.9rem; background: #fffdf5; outline: none; resize: none; border-bottom: 1px solid var(--border); }
        .save-indicator { padding: 10px 20px; font-size: 0.7rem; font-weight: 700; color: var(--success); opacity: 0; transition: 0.3s; }

        /* Mobile */
        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 1fr; }
            .phase-rail, .sidebar, .utility { display: none; }
            main.viewer { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="phase-rail">
        <div class="phase-icon active" onclick="loadPhase(1)" title="Foundations"><i class="fa-solid fa-brain"></i></div>
        <div class="phase-icon" onclick="loadPhase(2)" title="Dental Sciences"><i class="fa-solid fa-tooth"></i></div>
        <div class="phase-icon" onclick="loadPhase(3)" title="Clinical Subjects"><i class="fa-solid fa-toolbox"></i></div>
        <div class="phase-icon" onclick="loadPhase(4)" title="Clinical Thinking"><i class="fa-solid fa-rotate"></i></div>
        <div class="phase-icon" onclick="loadPhase(5)" title="Board Prep"><i class="fa-solid fa-graduation-cap"></i></div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0; font-size: 1.2rem;">DentoGuide</h2>
        </div>
        <div class="progress-box">
            <h4>Module Mastery</h4>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        </div>
        <input type="text" id="subjectSearch" class="search-bar" placeholder="Quick search subjects...">
        <div id="subject-list"></div>
    </aside>

    <main class="viewer">
        <div id="render-target" class="card"></div>
    </main>

    <aside class="utility">
        <div class="ai-head"><i class="fa-solid fa-robot" style="color:var(--brand)"></i> DentoAI Assistant</div>
        <div style="flex:1; background: #f1f5f9;">
            <iframe src="https://www.chatbase.co/chatbot-iframe/v_your_id" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <div class="save-indicator" id="save-msg">Draft Saved</div>
        <textarea id="notes" placeholder="Subject notes auto-save locally..."></textarea>
    </aside>
</div>

<script>
    const curriculum = {
        phase1: {
            name: "Core Foundations",
            subjects: {
                "Anatomy": {
                    title: "Head & Neck Mastery",
                    content: `<h2>Overview</h2><p>Essential structures for anesthesia and surgery.</p>`,
                    quiz: [
                        { q: "Which cranial nerve controls mastication?", options: ["CN VII", "CN V", "CN IX", "CN XII"], a: 1 },
                        { q: "Which foramen transmits the inferior alveolar nerve?", options: ["Mental", "Infraorbital", "Mandibular", "Jugular"], a: 2 }
                    ]
                },
                "Physiology": { title: "Physiology", content: "<p>Homeostatic mechanisms and cell function.</p>" },
                "Flashcards": {
                    title: "Phase 1 Rapid Recall",
                    type: "flashcards",
                    cards: [
                        { front: "Strongest facial bone?", back: "Mandible" },
                        { front: "Innervation of Masseter?", back: "Trigeminal (V3)" },
                        { front: "Hardest tissue in body?", back: "Enamel" }
                    ]
                }
            }
        },
        phase2: { name: "Dental Sciences", subjects: { "Materials": { title: "Dental Materials", content: "<p>Properties of restorative materials.</p>" } } },
        phase3: { name: "Clinical Subjects", subjects: { "Operative": { title: "Operative", content: "<p>Clinical procedures for restorations.</p>" } } },
        phase4: { name: "Clinical Thinking", subjects: { "Diagnosis": { title: "Diagnostic Workflow", content: "<p>Clinical reasoning frameworks.</p>" } } },
        phase5: { name: "Board Prep", subjects: { "Mock Exam": { title: "Timed Mock Exam", content: "<h3>Start your timed practice exam below.</h3><button class='quiz-btn'>Launch Exam Timer</button>" } } }
    };

    let activePhase = 1;
    let activeSubject = "Anatomy";

    function loadPhase(num) {
        activePhase = num;
        const phase = curriculum['phase' + num];
        document.getElementById('subject-list').innerHTML = "";
        
        Object.keys(phase.subjects).forEach(key => {
            const div = document.createElement('div');
            div.className = "sub-link";
            div.innerText = key;
            div.onclick = () => renderSubject(num, key);
            document.getElementById('subject-list').appendChild(div);
        });

        document.querySelectorAll('.phase-icon').forEach((icon, i) => icon.classList.toggle('active', (i+1) === num));
        renderSubject(num, Object.keys(phase.subjects)[0]);
    }

    function renderSubject(pNum, sKey) {
        activeSubject = sKey;
        const sub = curriculum['phase' + pNum].subjects[sKey];
        const target = document.getElementById('render-target');
        
        target.innerHTML = `<h1>${sub.title}</h1>${sub.content || ""}`;

        if (sub.type === "flashcards") {
            renderFlashcards(sub.cards);
        } else if (sub.quiz) {
            target.innerHTML += `<h2>🧠 Knowledge Check</h2><div id="quiz-box"></div>`;
            renderQuiz(sub.quiz);
        }

        // Notes logic
        const notesArea = document.getElementById('notes');
        notesArea.value = localStorage.getItem(`note_${sKey}`) || "";
        
        document.querySelectorAll('.sub-link').forEach(l => l.classList.toggle('active', l.innerText === sKey));
    }

    // INTERACTIVE: Quiz Engine
    function renderQuiz(quiz) {
        let current = 0;
        let score = 0;

        function showQ() {
            const q = quiz[current];
            document.getElementById('quiz-box').innerHTML = `
                <div class="clinical-box">
                    <p style="font-weight:700; margin-bottom:15px;">Question ${current + 1} of ${quiz.length}</p>
                    <h3>${q.q}</h3>
                    ${q.options.map((opt, i) => `<button class="quiz-btn" onclick="checkAnswer(${i})">${opt}</button>`).join('')}
                </div>`;
        }

        window.checkAnswer = function(idx) {
            if (idx === quiz[current].a) score++;
            current++;
            if (current < quiz.length) showQ();
            else {
                document.getElementById('quiz-box').innerHTML = `<div class="clinical-box" style="text-align:center;"><h2>Mastery Score: ${score}/${quiz.length}</h2><p>Progress updated.</p></div>`;
                updateProgress(20);
            }
        };
        showQ();
    }

    // INTERACTIVE: Flashcards
    function renderFlashcards(cards) {
        let idx = 0;
        const target = document.getElementById('render-target');
        
        function showCard() {
            target.innerHTML = `
                <h1>${activeSubject}</h1>
                <div class="flashcard" id="fc-main" onclick="this.classList.toggle('flipped'); this.innerText = this.classList.contains('flipped') ? '${cards[idx].back}' : '${cards[idx].front}'">
                    ${cards[idx].front}
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="quiz-btn" onclick="prevCard()">Previous</button>
                    <button class="quiz-btn" onclick="nextCard()">Next Card</button>
                </div>
            `;
        }
        window.nextCard = () => { idx = (idx + 1) % cards.length; showCard(); };
        window.prevCard = () => { idx = (idx - 1 + cards.length) % cards.length; showCard(); };
        showCard();
    }

    // INTERACTIVE: Auto-Save Notes
    const notesArea = document.getElementById('notes');
    const saveMsg = document.getElementById('save-msg');
    notesArea.addEventListener('input', () => {
        localStorage.setItem(`note_${activeSubject}`, notesArea.value);
        saveMsg.style.opacity = 1;
        setTimeout(() => saveMsg.style.opacity = 0, 1000);
    });

    // INTERACTIVE: Search
    document.getElementById('subjectSearch').addEventListener('input', function() {
        const val = this.value.toLowerCase();
        document.querySelectorAll('.sub-link').forEach(l => {
            l.style.display = l.innerText.toLowerCase().includes(val) ? "block" : "none";
        });
    });

    function updateProgress(val) {
        const fill = document.getElementById('progress-fill');
        let current = parseInt(fill.style.width) || 0;
        fill.style.width = Math.min(current + val, 100) + "%";
    }

    window.onload = () => loadPhase(1);
</script>
</body>
</html>
